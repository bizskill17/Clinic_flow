<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Clinic Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: home = three department tiles; department view = coloured left menu + work area */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#f7f9f9; --ink:#17262a; --muted:#5d6d70; --line:#d9e2e0;
  --spa:#3f7a63; --spa-soft:#e3efe9;
  --aes:#a2516b; --aes-soft:#f5e6eb;
  --pha:#2f5f9e; --pha-soft:#e3ebf6;
  /* Spa menu colours */
  --m0:#b0397a; --m0-soft:#f8e2ee;   /* Dashboard */
  --m1:#0f7f8c; --m1-soft:#ddf1f3;   /* Clients */
  --m2:#7048b6; --m2-soft:#ece5f8;   /* Services */
  --m3:#b8740b; --m3-soft:#fbefd9;   /* Invoice Form */
  --m4:#2f62c4; --m4-soft:#e2eafb;   /* Invoices */
  --m5:#2f8a46; --m5-soft:#e0f2e5;   /* Receipts */
  --m6:#c2413b; --m6-soft:#fbe4e2;   /* Outstanding */
  --m7:#657a10; --m7-soft:#eef3d8;   /* Service Categories */
  --m8:#0a72ad; --m8-soft:#dff0fa;   /* Cities */
  --m9:#8b5a3c; --m9-soft:#f4e9e1;   /* States */
  --m10:#4f58c9; --m10-soft:#e5e7fa; /* Users */
  --m11:#c8551a; --m11-soft:#fbe8dc; /* Medicines */
  --m12:#12805c; --m12-soft:#ddf3ea; /* Manufacturers */
  --m13:#5c6b7a; --m13-soft:#e7ebef; /* Suppliers */
  --mg:#3d4f54; --mg-soft:#e6eceb;   /* Masters group */
  --on-color:#ffffff;
  --overlay:rgba(16,24,26,.45);
  --focus:#17262a;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101718; --surface:#172123; --surface-2:#1b2729; --ink:#e7eeec; --muted:#9aaaa9; --line:#2a3739;
  --spa:#7cc4a4; --spa-soft:#1d2f28; --aes:#e397ae; --aes-soft:#33212a; --pha:#8fb4ea; --pha-soft:#1c2738;
  --m0:#f08cc4; --m0-soft:#3a1d2d;
  --m1:#4cc3cf; --m1-soft:#163033; --m2:#b49af0; --m2-soft:#2a2340; --m3:#f0b552; --m3-soft:#3a2d16;
  --m4:#86a9f2; --m4-soft:#1e2a44; --m5:#72cf8c; --m5-soft:#1b3323; --m6:#f08a83; --m6-soft:#3d1f1d;
  --m7:#bcd166; --m7-soft:#2a3114; --m8:#6cc0ee; --m8-soft:#152c3a; --m9:#d6a27e; --m9-soft:#35261c; --m10:#9ea6f5; --m10-soft:#23264a; --m11:#f2a275; --m11-soft:#3b2216; --m12:#5fd0a7; --m12-soft:#153228; --m13:#aab8c6; --m13-soft:#232b33; --mg:#b9c7c5; --mg-soft:#243234;
  --on-color:#101718; --overlay:rgba(0,0,0,.6);
  --focus:#e7eeec; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101718; --surface:#172123; --surface-2:#1b2729; --ink:#e7eeec; --muted:#9aaaa9; --line:#2a3739;
  --spa:#7cc4a4; --spa-soft:#1d2f28; --aes:#e397ae; --aes-soft:#33212a; --pha:#8fb4ea; --pha-soft:#1c2738;
  --m0:#f08cc4; --m0-soft:#3a1d2d;
  --m1:#4cc3cf; --m1-soft:#163033; --m2:#b49af0; --m2-soft:#2a2340; --m3:#f0b552; --m3-soft:#3a2d16;
  --m4:#86a9f2; --m4-soft:#1e2a44; --m5:#72cf8c; --m5-soft:#1b3323; --m6:#f08a83; --m6-soft:#3d1f1d;
  --m7:#bcd166; --m7-soft:#2a3114; --m8:#6cc0ee; --m8-soft:#152c3a; --m9:#d6a27e; --m9-soft:#35261c; --m10:#9ea6f5; --m10-soft:#23264a; --m11:#f2a275; --m11-soft:#3b2216; --m12:#5fd0a7; --m12-soft:#153228; --m13:#aab8c6; --m13-soft:#232b33; --mg:#b9c7c5; --mg-soft:#243234;
  --on-color:#101718; --overlay:rgba(0,0,0,.6);
  --focus:#e7eeec; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.wrap.wide{max-width:1320px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;padding-block:20px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.brand-name{font-weight:600;letter-spacing:.01em}

/* Home */
.grid{margin-top:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.dept{--c:var(--spa);--soft:var(--spa-soft);
  appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 26px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;min-height:200px;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.dept.aes{--c:var(--aes);--soft:var(--aes-soft)}
.dept.pha{--c:var(--pha);--soft:var(--pha-soft)}
.dept:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 12px 28px -18px var(--c)}
.icon{width:56px;height:56px;border-radius:14px;background:var(--soft);color:var(--c);display:grid;place-items:center}
.icon svg{width:28px;height:28px}
.dept h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.notice{margin-top:24px;padding:16px 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Department view */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.back svg{width:16px;height:16px}
.dept-title{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px}
.dept-title .icon{width:40px;height:40px;border-radius:11px;background:var(--spa-soft);color:var(--spa)}
.dept-title .icon svg{width:22px;height:22px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start;margin-top:8px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.sidebar-user{margin-top:14px;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:space-between}.sidebar-user strong{color:var(--text);display:block}.sidebar-user .btn{padding:7px 9px;white-space:nowrap}
.side-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 10px 10px}
.menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.mi{--c:var(--m1);--soft:var(--m1-soft);
  width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;border:0;background:transparent;cursor:pointer;text-align:left;font-weight:500;
  transition:background .15s ease}
.mi:hover{background:var(--soft)}
.mi .chip{flex:none;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--c);display:grid;place-items:center;transition:background .15s ease,color .15s ease}
.mi .chip svg{width:18px;height:18px}
.mi[aria-current="page"]{background:var(--c);color:var(--on-color)}
.mi[aria-current="page"] .chip{background:color-mix(in srgb,var(--on-color) 22%,transparent);color:var(--on-color)}
.mi.c0{--c:var(--m0);--soft:var(--m0-soft)}
.mi.c2{--c:var(--m2);--soft:var(--m2-soft)}
.mi.c3{--c:var(--m3);--soft:var(--m3-soft)}
.mi.c4{--c:var(--m4);--soft:var(--m4-soft)}
.mi.c5{--c:var(--m5);--soft:var(--m5-soft)}
.mi.c6{--c:var(--m6);--soft:var(--m6-soft)}
.mi.c7{--c:var(--m7);--soft:var(--m7-soft)}
.mi.c8{--c:var(--m8);--soft:var(--m8-soft)}
.mi.c9{--c:var(--m9);--soft:var(--m9-soft)}
.mi.c10{--c:var(--m10);--soft:var(--m10-soft)}
.mi.c11{--c:var(--m11);--soft:var(--m11-soft)}
.mi.c12{--c:var(--m12);--soft:var(--m12-soft)}
.mi.c13{--c:var(--m13);--soft:var(--m13-soft)}
.mi.cg{--c:var(--mg);--soft:var(--mg-soft)}
.mgroup .caret{margin-left:auto;width:16px;height:16px;transition:transform .15s ease}
.mgroup[aria-expanded="true"] .caret{transform:rotate(90deg)}
.mgroup.has-current{background:var(--soft)}
.submenu{list-style:none;margin:2px 0 4px 16px;padding:0 0 0 10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:2px}
.submenu .mi{padding:6px 8px;font-size:14px}
.submenu .mi .chip{width:28px;height:28px;border-radius:8px}
.submenu .mi .chip svg{width:16px;height:16px}

.work{--wc:var(--m0);--wsoft:var(--m0-soft);background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:480px;padding:24px 28px 28px;min-width:0;border-top:6px solid var(--wc)}
.w-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}
.w-head h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.2vw,32px);margin:0;line-height:1.15}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.banner{margin-bottom:14px;padding:10px 14px;border-radius:10px;background:var(--m3-soft);color:var(--ink);font-size:14px;border:1px solid var(--line)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--wc)}
.btn.primary{background:var(--wc);border-color:var(--wc);color:var(--on-color);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn.danger{color:var(--m6)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.modal input:disabled,.modal select:disabled{cursor:not-allowed!important;opacity:.55!important;color:var(--muted)!important}
.link{background:none;border:0;padding:0;color:var(--wc);font-weight:600;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:end}
.toolbar .field{flex:0 1 auto}
.toolbar .grow{flex:1 1 220px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field .req{color:var(--m6)}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--wc);outline-offset:0;border-color:var(--wc)}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px 14px;align-items:start}
.field .hint{margin-top:2px;line-height:1.35}
.f-grid .span2{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.err{color:var(--m6);font-size:14px;font-weight:500}
.hint{color:var(--muted);font-size:13px}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
.row-acts{display:flex;gap:6px;justify-content:flex-end}
.sub{color:var(--muted);font-size:13px}
.due{color:var(--m6);font-weight:600}
.adv{color:var(--m5);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.paid{background:var(--m5-soft);color:var(--m5)}
.pill.partial{background:var(--m3-soft);color:var(--m3)}
.pill.unpaid{background:var(--m6-soft);color:var(--m6)}
.pill.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);border-left:5px solid var(--tc)}
.tile .k{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.2}
.tile .s{font-size:13px;color:var(--muted)}
.panels{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:1000px){.panels{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:15px;font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--m0)}
.chart .bar.today{fill:var(--m4)}
.chart .lbl{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;margin-bottom:10px;font-size:14px}
.hbar .track{grid-column:1/-1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .fill{height:100%;border-radius:99px;background:var(--hc,var(--m2))}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sc-soft);color:var(--sc)}
.step p{margin:0;color:var(--muted);font-size:14px}

/* Invoice form */
.client-pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.icon-plus{width:38px;height:38px;padding:0;color:var(--wc)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.combo{position:relative}
.combo-in{padding-right:32px !important}
.combo-caret{position:absolute;right:10px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.combo-list{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow:auto;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px -14px rgba(0,0,0,.35);min-width:220px}
.combo-list li{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px}
.combo-list li.act,.combo-list li[data-i]:hover{background:var(--wsoft,var(--surface-2))}
.combo-list li.sel{font-weight:600}
.combo-list li.none{color:var(--muted);cursor:default}
.sec-h{font-size:15px;margin:22px 0 10px}
.lines{display:flex;flex-direction:column;gap:12px}
.line{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.line-top{display:grid;grid-template-columns:26px minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.3fr) 32px;gap:10px;align-items:end}
.line-n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--wsoft);color:var(--wc);margin-bottom:6px}
.line-nums{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding-left:36px}
.line .icon-btn{margin-bottom:3px}
.line-nums.n8{grid-template-columns:repeat(9,minmax(0,1fr))}
@media (max-width:1240px){.line-nums.n8{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ro-box{min-height:38px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ro-box.strong{font-weight:700;border-style:solid}
@media (max-width:860px){.line-top{grid-template-columns:minmax(0,1fr) 32px}.line-top .line-n{display:none}.line-top .field{grid-column:1/2}.line-top .icon-btn{grid-column:2;grid-row:1}.line-nums,.line-nums.n8{grid-template-columns:repeat(2,minmax(0,1fr));padding-left:0}}
.items td{padding:6px 8px}
.items input,.items select{min-height:34px;padding:6px 8px}
.items .c-svc{min-width:200px}
.items .c-n{width:110px;min-width:90px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--m6);font-size:18px;line-height:1}
.form-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:18px;margin-top:16px}
@media (max-width:760px){.form-bottom{grid-template-columns:1fr}}
.totals{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.totals .r{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-variant-numeric:tabular-nums}
.totals .r.big{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:20px;font-weight:700}
.pay-box{margin-top:16px;border:1px dashed var(--line);border-radius:12px;padding:14px 16px}
.pay-box h3{margin:0 0 10px;font-size:15px}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.static{padding:8px 0;font-weight:700;font-variant-numeric:tabular-nums}
.ro-field{min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-weight:600;display:flex;align-items:center}

/* Modal + toast */
[hidden]{display:none!important}
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 32px) 16px 32px;overflow-y:auto;z-index:50}
.modal{--wc:var(--m1);background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:640px;padding:22px 24px;border-top:5px solid var(--wc);box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
.modal.wide{max-width:820px}
.modal h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 14px}
.modal .m-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.doc-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-bottom:14px}
.doc-head .big{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
.ro .w{display:none !important}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.ledger-peek{margin-top:8px}
.prog{display:flex;align-items:center;gap:8px;min-width:120px}
.prog-bar{flex:1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.prog-bar span{display:block;height:100%;background:var(--m5);border-radius:99px}
.prog-t{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.btn.sm.primary{color:var(--on-color)}
tr.click-row{cursor:pointer}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:260px;overflow-y:auto;padding:2px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 0;font-size:12.5px;font-variant-numeric:tabular-nums;cursor:pointer}
.slot:hover{border-color:var(--wc)}
.slot.sel{background:var(--wc);border-color:var(--wc);color:var(--on-color);font-weight:600}
.slot.start{outline:2px solid var(--wc);outline-offset:1px}
.slot.busy{background:var(--surface-2);color:var(--muted);text-decoration:line-through;cursor:not-allowed;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph-slot{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ph-label{font-weight:600;font-size:13px}
.ph-grid.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ph-grid.five .ph-slot{padding:6px;gap:6px}
@media (max-width:700px){.ph-grid.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ph-frame{aspect-ratio:3/4;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph-frame img{width:100%;height:100%;object-fit:cover;display:block}
.ph-acts{display:flex;gap:6px;flex-wrap:wrap}
.consent-text{white-space:pre-line;border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:260px;overflow:auto;font-size:14px;line-height:1.55;background:var(--surface-2)}
.sig-wrap{position:relative;border:1.5px dashed var(--line);border-radius:10px;background:#fff;height:180px;max-width:560px}
.sig-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;border-radius:10px}
.sig-hint{position:absolute;left:14px;bottom:10px;color:#8a9a9c;font-size:13px;pointer-events:none}
.sig-show{display:inline-block;background:#fff;border-radius:8px;padding:8px 12px}
.sig-show img{display:block;max-height:110px;max-width:100%}
.cons-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:38px}
.cons{display:flex;flex-direction:column;gap:8px}
.cons-row{display:grid;grid-template-columns:minmax(0,2.2fr) 110px minmax(0,1fr) 32px;gap:8px;align-items:center}
.cons-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cons.compact .cons-row{grid-template-columns:minmax(0,2fr) 90px minmax(0,1.2fr) 32px}
.line .cons-line{display:block;margin-top:10px;padding:10px 0 0 36px;border-top:1px dashed var(--line)}
.cons-lbl{font-size:13px;font-weight:600;margin-bottom:6px}
@media (max-width:700px){.cons-row,.cons.compact .cons-row{grid-template-columns:minmax(0,1fr) 80px 32px}.cons-row .ci-av{grid-column:1/-1;grid-row:2}.line .cons-line{padding-left:0}}
.logo-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.logo-box{width:180px;height:100px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#ffffff;overflow:hidden}
.logo-box img{max-width:160px;max-height:84px;object-fit:contain}
.chips:not(:empty){margin-bottom:6px}
.chip-tag{display:inline-flex;align-items:center;gap:4px;background:var(--wsoft);color:var(--ink);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600}
.chip-tag button{border:0;background:transparent;cursor:pointer;font-size:15px;line-height:1;width:22px;height:22px;border-radius:50%;color:inherit}
.chip-tag button:hover{background:var(--surface)}
tr.click-row:hover td{background:var(--wsoft)}
.ledger-peek summary{cursor:pointer;color:var(--wc);font-weight:600;font-size:14px;margin-bottom:8px}
tr.grp td{background:var(--surface-2);border-top:1px solid var(--line)}
tr.sub-row td{font-size:13px;padding-top:6px;padding-bottom:6px}
input[type=month],input[type=time]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}

@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  .side{position:static;padding:8px;min-width:0;max-width:100%}
  .side-label{display:none}
  .menu{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .menu li{flex:none}
  .menu li.group{display:flex;gap:6px}
  .submenu{flex-direction:row;margin:0;padding:0 0 0 6px;border-left:2px solid var(--line);gap:6px}
  .mgroup .caret{transform:rotate(0)}
  .mgroup[aria-expanded="true"] .caret{transform:rotate(180deg)}
  .mi{width:auto;white-space:nowrap;padding:7px 12px 7px 7px}
  .mi .chip{width:28px;height:28px}
  .work{padding:18px 16px 20px}
}
@media (prefers-reduced-motion:reduce){.dept,.mi,.mi .chip{transition:none}.dept:hover{transform:none}}
.ap-tbl tbody td{font-weight:700}
.ap-tbl tbody .sub{color:var(--ink,inherit);font-size:inherit;font-weight:700}
</style>

function allBills(){
  var b=allInvoices().map(function(i){return {id:i.id,clientId:i.clientId,date:i.date,seq:i.seq,total:+i.total||0,opening:!!i.opening,no:i.no,module:i.opening?'—':'Spa',kind:i.opening?'ob':'inv',clientName:i.clientName,clientPhone:i.clientPhone}});
  S.phMoves.forEach(function(m){if(m.type==='Sale'&&m.clientId)b.push({id:m.id,clientId:m.clientId,date:m.date,seq:m.seq,total:+m.total||0,no:m.no,module:'Pharmacy',kind:'sale',clientName:m.clientName,clientPhone:m.clientPhone})});
  S.aeInvoices.forEach(function(v){if(v.clientId)b.push({id:v.id,clientId:v.clientId,date:v.date,seq:v.seq,total:+v.total||0,no:v.no,module:'Aesthetics',kind:'ae',clientName:v.clientName,clientPhone:v.clientPhone})});
  return b;
}
function allReceipts(){
  return S.receipts.map(function(r){return Object.assign({},r,{src:'receipts'})})
    .concat(S.phReceipts.map(function(r){return Object.assign({},r,{src:'phReceipts'})}));
}
function allocate(){
  var pool={};
  S.clients.forEach(function(c){if((+c.openingBal||0)>0&&c.obType==='Advance')pool[c.id]=r2(c.openingBal)});
  var recs=allReceipts().filter(function(r){return r.clientId}).map(function(r){return {clientId:r.clientId,invoiceId:r.invoiceId||r.saleId||r.aeInvId||'',amount:r.amount,date:r.date,seq:r.seq}})
    .concat(S.phMoves.filter(function(m){return m.type==='Return'&&m.clientId}).map(function(m){return {clientId:m.clientId,invoiceId:m.saleId||'',amount:m.total,date:m.date,seq:1e6+(+m.seq||0)}}));
  return allocCore(allBills(),recs,pool);
}
function paidMap(){return allocate().paid}
function clientAccount(cid,al){
  al=al||allocate(); var billed=0,received=0,due=0;
  allBills().forEach(function(b){if(b.clientId!==cid)return;if(!b.opening)billed+=b.total;due+=Math.max(0,r2(b.total-(al.paid[b.id]||0)))});
  allReceipts().forEach(function(r){if(r.clientId===cid)received+=+r.amount||0});
  S.phMoves.forEach(function(m){if(m.type==='Return'&&m.clientId===cid)received+=+m.total||0});
  return {billed:r2(billed),received:r2(received),due:r2(due),advance:r2(al.advance[cid]||0)};
}
function billInfo(b,al){var paid=r2((al||allocate()).paid[b.id]||0),bal=r2(b.total-paid);return {paid:paid,bal:bal,status:bal<=0.004?'paid':(paid>0?'partial':'unpaid')}}
function countOf(n,t,noun){return n+' of '+t+' '+noun}
function balanceCell(a){return a.due>0.004?'<span class="due">'+money(a.due)+' due</span>':(a.advance>0.004?'<span class="adv">'+money(a.advance)+' advance</span>':'<span class="sub">Settled</span>')}
function invInfo(inv,pm){var paid=r2((pm||paidMap())[inv.id]||0);var bal=r2((+inv.total||0)-paid);return {paid:paid,bal:bal,status:bal<=0.004?'paid':(paid>0?'partial':'unpaid')}}
function statusPill(s){return '<span class="pill '+s+'">'+({paid:'Paid',partial:'Part paid',unpaid:'Unpaid'}[s])+'</span>'}
/* next number = the lowest number not in use, so numbers freed by a delete are reused (1, 2, 3 … again) */
function nextSeq(list){var used={};list.forEach(function(x){used[+x.seq||0]=1});var n=1;while(used[n])n++;return n}
function clientById(id){return S.clients.find(function(c){return c.id===id})}
function findIn(kind,id){return id?S[kind].find(function(x){return x.id===id}):null}
function catName(s){var c=findIn('categories',s.categoryId);return c?c.name:(s.category||'')}
function stateName(id){var s=findIn('states',id);return s?s.name:''}
function cityLabel(cityId){var c=findIn('cities',cityId);return c?{city:c.name,state:stateName(c.stateId)}:{city:'',state:''}}
function invById(id){return S.invoices.find(function(i){return i.id===id})}
function sortInv(a,b){return (b.date||'').localeCompare(a.date||'')||(+b.seq||0)-(+a.seq||0)}

/* downloads */
var dlPromise=null;
function getDownloads(){ if(!dlPromise) dlPromise=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(function(){return null}):Promise.resolve(null); return dlPromise; }
function saveFile(name,data){
  getDownloads().then(function(dl){
    if(!dl){ /* outside claude.ai: plain browser download */
      try{var blob=data instanceof Blob?data:new Blob([data],{type:/\.pdf$/i.test(name)?'application/pdf':(/\.csv$/i.test(name)?'text/csv':'application/octet-stream')});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast('Saved '+name)}catch(e0){toast('Downloads are not available in this view.')}
      return}
    return dl.save({filename:name,data:data}).then(function(){toast('Saved '+name)}).catch(function(e){
      if(e&&e.code==='declined')return;
      if(e&&e.code==='rate_limited'){toast('A download is already waiting for your answer.');return}
      toast('The file could not be saved here.');
    });
  });
}
function csv(rows){return rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n')}

function go(key,opts){

  $$('.mi[data-key]',nav).forEach(function(b){ if(b.dataset.key===key) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $$('.mgroup',nav).forEach(function(g){var sub=$('#'+g.getAttribute('aria-controls'));var has=!!$('.mi[data-key="'+key+'"]',sub);g.classList.toggle('has-current',has);if(has){g.setAttribute('aria-expanded','true');sub.hidden=false}});
  lastKey[dept]=key;

  $$('[data-inv]').forEach(function(b){ if(b._i) return; b._i=1; b.addEventListener('click',function(){ viewInvoice(b.dataset.inv); }); });
  $$('[data-aeinv]').forEach(function(b){ if(b._ai) return; b._ai=1; b.addEventListener('click',function(){ viewAeInv(b.dataset.aeinv); }); });
  $$('[data-client-view]').forEach(function(b){ if(b._c) return; b._c=1; b.addEventListener('click',function(){ viewClient(b.dataset.clientView); }); });
  $$('[data-ledger]').forEach(function(b){ if(b._lg) return; b._lg=1; b.addEventListener('click',function(){ viewLedger(b.dataset.ledger,b.dataset.dk||dept); }); });
  $$('[data-pm]').forEach(function(b){ if(b._pm) return; b._pm=1; b.addEventListener('click',function(){ phViewMove(b.dataset.pm); }); });
  $$('[data-phpay]').forEach(function(b){ if(b._pp) return; b._pp=1; b.addEventListener('click',function(){ var m=phMove(b.dataset.phpay); phRecordPayment(b.dataset.phpay,m&&m.clientId); }); });
  $$('[data-pay]').forEach(function(b){ if(b._p) return; b._p=1; b.addEventListener('click',function(){ var i=invById(b.dataset.pay); recordPayment(b.dataset.pay,i&&i.clientId); }); });

SECTIONS.dashboard={
  mount:function(){ work.innerHTML=head('Dashboard','<button class="btn primary w" data-go="invoice-form">New invoice</button>')+'<div id="body"></div>'; },
  update:function(){
    var b=$('#body',work); if(!b) return;
    if(!ready()){b.innerHTML=loadingHTML();return}
    if(!S.services.length&&!S.clients.length&&!S.invoices.length){
      b.innerHTML='<p class="hint" style="margin:0 0 14px">Set up the Spa in three steps. The dashboard fills in as you bill clients.</p><div class="steps">'+
        step(1,'--m2','Add your services','List each treatment with its price and GST rate.','services','Go to Services')+
        step(2,'--m1','Add your clients','Save names and phone numbers so billing is quick.','clients','Go to Clients')+
        step(3,'--m3','Create an invoice','Bill a client and record what they paid.','invoice-form','Open Invoice Form')+'</div>';
      return;
    }
    var t=todayStr(), ym=t.slice(0,7), pm=paidMap();
    var invT=S.invoices.filter(function(i){return i.date===t}), recT=S.receipts.filter(function(r){return r.date===t});
    var invM=S.invoices.filter(function(i){return (i.date||'').slice(0,7)===ym}), recM=S.receipts.filter(function(r){return (r.date||'').slice(0,7)===ym});
    var sum=function(a,f){return r2(a.reduce(function(s,x){return s+(+x[f]||0)},0))};
    var outAmt=0,outN=0,alx=allocate(); dueBills(alx).forEach(function(i){outAmt+=billInfo(i,alx).bal;outN++});
    var monthName=nowIST().toLocaleDateString('en-IN',{month:'long'});
    var html='<div class="tiles">'+
      tile('--m0','Sales today',money0(sum(invT,'total')),invT.length+' invoice'+(invT.length===1?'':'s'))+
      tile('--m5','Collected today',money0(sum(recT,'amount')),recT.length+' receipt'+(recT.length===1?'':'s'))+
      tile('--m4','Sales in '+monthName,money0(sum(invM,'total')),'Collected '+money0(sum(recM,'amount')))+
      tile('--m6','Outstanding',money0(outAmt),outN+' unpaid bill'+(outN===1?'':'s')+' (all modules)')+'</div>';

    // chart: last 14 days sales
    var days=[],base=nowIST(); for(var k=13;k>=0;k--){var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()-k);days.push(ds(d))}
    var vals=days.map(function(dd){return sum(S.invoices.filter(function(i){return i.date===dd}),'total')});
    html+='<div class="panels"><div class="panel chart"><h3>Sales, last 14 days</h3>'+barChart(days,vals,t)+'</div>';
    // payment modes
    var modeTot={}; recM.forEach(function(r){modeTot[r.mode||'Other']=r2((modeTot[r.mode||'Other']||0)+(+r.amount||0))});
    var mk=Object.keys(modeTot).sort(function(a,b){return modeTot[b]-modeTot[a]}), mmax=Math.max.apply(null,mk.map(function(k){return modeTot[k]}).concat([1]));
    var mcol=['--m5','--m4','--m2','--m3','--m1'];
    html+='<div class="panel"><h3>Payments received in '+esc(monthName)+'</h3>'+(mk.length?mk.map(function(k,ix){return hbar(k,money0(modeTot[k]),modeTot[k]/mmax,mcol[ix%mcol.length])}).join(''):'<p class="hint">No payments recorded this month yet.</p>')+'</div></div>';

    // recent invoices + top services
    var recent=S.invoices.slice().sort(sortInv).slice(0,6);
    html+='<div class="panels"><div class="panel"><h3>Recent invoices</h3>'+(recent.length?'<div class="tbl"><table><thead><tr><th>Invoice</th><th>Client</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>'+
      recent.map(function(i){var x=invInfo(i,pm);return '<tr><td class="nowrap"><button class="link" data-inv="'+esc(i.id)+'">'+esc(i.no)+'</button><div class="sub">'+fmtDate(i.date)+'</div></td><td>'+esc(i.clientName)+'</td><td class="num">'+money(i.total)+'</td><td>'+statusPill(x.status)+'</td></tr>'}).join('')+
      '</tbody></table></div>':'<p class="hint">No invoices yet.</p>')+'</div>';
    var svc={}; invM.forEach(function(i){(i.items||[]).forEach(function(it){var n=it.name||'Service';svc[n]=svc[n]||{q:0,a:0};svc[n].q+=(+it.qty||0);svc[n].a=r2(svc[n].a+(+it.amount||0))})});
    var sk=Object.keys(svc).sort(function(a,b){return svc[b].a-svc[a].a}).slice(0,6), smax=sk.length?svc[sk[0]].a||1:1;
    html+='<div class="panel"><h3>Top services in '+esc(monthName)+'</h3>'+(sk.length?sk.map(function(k){return hbar(k+' <span class="sub">× '+svc[k].q+'</span>',money0(svc[k].a),svc[k].a/smax,'--m2',true)}).join(''):'<p class="hint">No services billed this month yet.</p>')+'</div></div>';
    b.innerHTML=html;
  }
};
function step(n,c,t,p,goKey,label){return '<div class="step" style="--sc:var('+c+');--sc-soft:var('+c+'-soft)"><span class="n">'+n+'</span><strong>'+esc(t)+'</strong><p>'+esc(p)+'</p><button class="btn" data-go="'+goKey+'">'+esc(label)+'</button></div>'}
function tile(c,k,v,s){return '<div class="tile" style="--tc:var('+c+')"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div><div class="s">'+esc(s)+'</div></div>'}
function hbar(label,val,frac,c,rawLabel){return '<div class="hbar" style="--hc:var('+c+')"><span>'+(rawLabel?label:esc(label))+'</span><span class="num">'+esc(val)+'</span><div class="track"><div class="fill" style="width:'+Math.max(2,Math.round(frac*100))+'%"></div></div></div>'}
function barChart(days,vals,today){
  var W=560,H=200,pl=8,pr=8,pt=22,pb=30,n=days.length,max=Math.max.apply(null,vals.concat([0]));
  var cw=(W-pl-pr)/n,bw=cw*0.62,ih=H-pt-pb;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily sales for the last 14 days"><line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  if(max>0) s+='<line class="grid-l" stroke-dasharray="3 4" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+pt+'" y2="'+pt+'"/><text class="lbl" x="'+pl+'" y="'+(pt-7)+'">'+esc(money0(max))+'</text>';
  days.forEach(function(d,i){
    var v=vals[i],h=max>0?Math.max(v>0?3:0,v/max*ih):0,x=pl+i*cw+(cw-bw)/2,y=H-pb-h;
    s+='<rect class="bar'+(d===today?' today':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"><title>'+esc(fmtDate(d)+': '+money(v))+'</title></rect>';
    if(i%2===1||d===today){var dt=parseD(d);s+='<text class="lbl" text-anchor="middle" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-pb+17)+'">'+dt.getDate()+' '+dt.toLocaleDateString('en-IN',{month:'short'})+'</text>'}
  });
  return s+'</svg>'+(max===0?'<p class="hint" style="margin:6px 0 0">No sales in the last 14 days.</p>':'');
}

function clientStats(){
  var al=allocate(),st={};
  S.clients.forEach(function(c){var a=clientAccount(c.id,al);st[c.id]={n:0,last:'',billed:a.billed,received:a.received,due:a.due,advance:a.advance,acct:a}});
  S.invoices.forEach(function(i){var s=st[i.clientId];if(!s)return;s.n++;if((i.date||'')>s.last)s.last=i.date});
  return st;
}

function combo(host,cfg){
  host.innerHTML='<div class="combo"><input type="text" class="combo-in" id="'+cfg.id+'" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" placeholder="'+esc(cfg.placeholder||'Select')+'"'+(cfg.label?' aria-label="'+esc(cfg.label)+'"':'')+'><svg class="combo-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><ul class="combo-list" role="listbox" hidden></ul></div>';
  var input=host.querySelector('input'), list=host.querySelector('ul'), val=cfg.value||'', act=-1, shown=[];
  function labelOf(v){var o=cfg.options().find(function(o){return o[0]===v});return o?o[1]:(v&&cfg.missing?cfg.missing(v):'')}
  function setText(){input.value=labelOf(val)}
  function hl(){$$('li[data-i]',list).forEach(function(li,ix){li.classList.toggle('act',ix===act);if(ix===act)li.scrollIntoView({block:'nearest'})})}
  function open(filter){
    var q=norm(filter);
    shown=cfg.options().filter(function(o){return !q||norm(o[1]+' '+(o[2]||'')).indexOf(q)>=0}).slice(0,150);
    list.innerHTML=shown.length?shown.map(function(o,ix){return '<li role="option" data-i="'+ix+'"'+(o[0]===val?' class="sel" aria-selected="true"':'')+'>'+esc(o[1])+(o[2]?' <span class="sub">'+esc(o[2])+'</span>':'')+'</li>'}).join(''):'<li class="none">'+esc(q?'No matches':(cfg.emptyText||'Nothing to choose yet'))+'</li>';
    list.hidden=false; input.setAttribute('aria-expanded','true'); act=q&&shown.length?0:-1; hl();
  }
  function close(){if(list.hidden)return;list.hidden=true;input.setAttribute('aria-expanded','false');setText()}
  function pick(ix){var o=shown[ix];if(!o)return;val=o[0];list.hidden=true;input.setAttribute('aria-expanded','false');setText();cfg.onChange(val)}
  input.addEventListener('focus',function(){open('');input.select()});
  input.addEventListener('click',function(){if(list.hidden)open('')});
  input.addEventListener('input',function(){open(input.value)});
  input.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();if(list.hidden)open('');act=Math.min(act+1,shown.length-1);hl()}
    else if(e.key==='ArrowUp'){e.preventDefault();act=Math.max(act-1,0);hl()}
    else if(e.key==='Enter'){if(!list.hidden){e.preventDefault();pick(act>=0?act:0)}}
    else if(e.key==='Escape'){if(!list.hidden){e.stopPropagation();close()}}
    else if(e.key==='Tab'){close()}
  });
  input.addEventListener('blur',function(){setTimeout(function(){
    if(cfg.allowEmpty&&!input.value.trim()&&val){val='';cfg.onChange('')}
    close();
  },120)});
  list.addEventListener('mousedown',function(e){var li=e.target.closest('li[data-i]');e.preventDefault();if(li)pick(+li.dataset.i)});
  setText();
  return {set:function(v){val=v;setText()},refresh:function(){if(list.hidden&&document.activeElement!==input)setText()},el:input};
}

function newDraft(){return {id:null,date:todayStr(),clientId:'',items:[blankItem()],roundOn:true,payAmount:'',payMode:'Cash',payRef:''}}
function lineCalc(it){var gross=r2((+it.qty||0)*(+it.rate||0)),pct=Math.min(Math.max(+it.discPct||0,0),100),disc=r2(gross*pct/100),amt=r2(gross-disc),tax=r2(amt*(+it.gst||0)/100);return {gross:gross,disc:disc,amount:amt,tax:tax,total:r2(amt+tax)}}

function sumItems(items){
  var t={subtotal:0,discount:0,taxable:0,tax:0};
  items.forEach(function(it){if(!it.serviceId)return;var c=lineCalc(it);t.subtotal+=c.gross;t.discount+=c.disc;t.taxable+=c.amount;t.tax+=c.tax});

function saveInvoice(){

  if(!draft.date) return show('Choose the invoice date.');

  if(!items.length) return show('Add at least one service.');
  for(var k=0;k<items.length;k++){var it=items[k];if(!(it.qty>0))return show('Quantity for '+it.name+' must be at least 1.');if(it.rate<0)return show('Rate for '+it.name+' can’t be negative.');if(it.discPct<0||it.discPct>100)return show('Discount % for '+it.name+' must be between 0 and 100.')}
  var saved=items.map(function(it){var lc=lineCalc(it),sv=S.services.find(function(x){return x.id===it.serviceId});return {consumables:cleanCons(it.consumables),serviceId:it.serviceId,name:it.name,sac:(sv&&sv.sac)||it.sac||'',qty:+it.qty,rate:r2(it.rate),discPct:r2(it.discPct),disc:lc.disc,gst:+it.gst||0,amount:lc.amount,tax:lc.tax,total:lc.total,performedBy:it.performedBy||'',performedByName:userName(it.performedBy),referredBy:it.referredBy||'',referredByName:userName(it.referredBy)}});
  var t=sumItems(items), total=t.total;
  var now=new Date().toISOString(), editing=!!draft.id, pay=0;
  if(!editing){pay=r2(draft.payAmount);if(pay<0)return show('Payment can’t be negative.')}
  var seq=editing?draft.seq:nextSeq(S.invoices);
  var inv={id:draft.id||newId('i'),seq:seq,no:editing?draft.no:'INV-'+pad(seq),date:draft.date,clientId:c.id,clientName:c.name,clientPhone:c.phone,items:saved,subtotal:t.subtotal,discount:t.discount,taxable:t.taxable,tax:t.tax,roundOn:!!draft.roundOn,roundOff:t.roundOff,total:total,createdAt:draft.createdAt||now,updatedAt:now};
  var btn=$('#inv-form [type=submit]'); btn.disabled=true;
  put('invoices',inv).then(function(){
    if(pay>0){var rs=nextReceiptNo().seq;return put('receipts',{id:newId('r'),seq:rs,no:'RCT-'+pad(rs),date:draft.date,invoiceId:inv.id,invoiceNo:inv.no,clientId:c.id,clientName:c.name,amount:pay,mode:draft.payMode,reference:draft.payRef.trim(),createdAt:now})}
  }).then(function(){
    toast(editing?'Invoice '+inv.no+' updated':'Invoice '+inv.no+' saved'+(pay>0?' with payment':''));
    draft=null; go('invoices'); viewInvoice(inv.id,inv);
  }).catch(function(e){btn.disabled=false;show(errText(e))});
}

    items:(i.items||[]).map(function(it){return {serviceId:it.serviceId,name:it.name,sac:it.sac||'',qty:it.qty,rate:it.rate,discPct:discPctOf(it),gst:it.gst,performedBy:it.performedBy||'',performedByName:it.performedByName||'',referredBy:it.referredBy||'',referredByName:it.referredByName||'',consumables:copyCons(it.consumables)}})};

function filteredInvoices(){

function trimLogo(lg){
  if(!lg||!lg.data||logoTrim.src===lg.data||logoTrim.busy) return;
  logoTrim.busy=true;
  var img=new Image();
  img.onload=function(){

function uploadLogo(file,errEl){
  var fail=function(t){if(errEl){errEl.textContent=t;errEl.hidden=false}else toast(t)};
  if(errEl) errEl.hidden=true;
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)) return fail('Choose a PNG or JPG image.');
  if(file.size>8*1024*1024) return fail('That image is larger than 8 MB. Choose a smaller file.');
  var rd=new FileReader();
  rd.onerror=function(){fail('The image could not be read.')};
  rd.onload=function(){
    var img=new Image();
    img.onerror=function(){fail('The image could not be opened.')};
    img.onload=function(){
      var max=480, r=Math.min(1,max/img.width,max/img.height), w=Math.max(1,Math.round(img.width*r)), h=Math.max(1,Math.round(img.height*r));
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
      var data=cv.toDataURL('image/png'), fmt='PNG';
      if(data.length>180000){cx.globalCompositeOperation='destination-over';cx.fillStyle='#ffffff';cx.fillRect(0,0,w,h);data=cv.toDataURL('image/jpeg',0.85);fmt='JPEG'}
      if(data.length>230000) return fail('The logo is too detailed to store. Try a simpler or smaller image.');
      put('business',{id:'logo',data:data,w:w,h:h,fmt:fmt,updatedAt:new Date().toISOString()}).then(function(){toast('Logo saved');bizDirty=false;SECTIONS.business.update()}).catch(function(e){fail(errText(e))});
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

var PH_PREFIX={Purchase:'PUR',Return:'SRN',Sale:'SAL',Expiry:'EXP',Damage:'DMG','Spa Issue':'SPI','Aesthetics Issue':'AEI'};
var PH_KIND={Purchase:'in',Return:'in',Sale:'out',Expiry:'out',Damage:'out','Spa Issue':'out','Aesthetics Issue':'out'};
var PH_TYPE_PILL={Purchase:'paid',Return:'partial',Sale:'paid',Expiry:'unpaid',Damage:'unpaid','Spa Issue':'off','Aesthetics Issue':'off'};
function phItem(id){return findIn('phItems',id)}
function lotLabel(b){return b.opening||b.batch==='OPENING'?'Opening stock':(b.expiry?'Exp '+fmtExp(b.expiry):(b.batch&&b.batch!=='NOEXP'?b.batch:'No expiry'))}
function phMove(id){return findIn('phMoves',id)}
function fmtExp(e){if(!e)return '';var p=String(e).split('-');return p.length>=2?p[1]+'/'+p[0]:e}
function expDays(e){if(!e)return null;var p=String(e).split('-').map(Number);var last=new Date(p[0],p[1],0);var t=nowIST();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((last-t)/86400000)}
function phNextNo(type){var seq=nextSeq(S.phMoves.filter(function(m){return m.type===type}));return {seq:seq,no:PH_PREFIX[type]+'-'+pad(seq)}}
function phPartyName(m){
  if(m.type==='Purchase') return m.supplierName||(findIn('phSuppliers',m.supplierId)||{}).name||'';
  if(m.type==='Sale'||m.type==='Return') return m.clientName||m.customerName||'Walk-in customer';
  return '';
}
/* stock by batch; excludeId leaves one document out (used while editing it) */
function phBatches(excludeId){
  /* one stock record per item: opening + Item In - Item Issue; keeps the latest purchase rate and MRP */
  var m={};
  function get(itemId){var k=itemId+'|ALL';return m[k]=m[k]||{key:k,itemId:itemId,batch:'ALL',mrp:0,rate:0,qty:0,lastDate:''}}
  S.phItems.forEach(function(i){var q=+i.openingQty||0,rt=+i.openingRate||0;if(q||rt){var b=get(i.id);b.qty+=q;if(rt)b.rate=rt}});
  S.phMoves.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'')}).forEach(function(mv){
    if(mv.id===excludeId) return;
    (mv.lines||[]).forEach(function(l){
      var b=get(l.itemId), q=+l.qty||0;
      if(PH_KIND[mv.type]==='in'){b.qty+=q;if(mv.type==='Purchase'&&(mv.date||'')>=b.lastDate){b.mrp=+l.mrp||b.mrp;b.rate=+l.rate||b.rate;b.lastDate=mv.date||''}}
      else b.qty-=q;
    });
  });
  return m;
}
function phStockRec(map,itemId){return map[itemId+'|ALL']||{qty:0,mrp:0,rate:0}}
function itemBatches(map,itemId){return Object.keys(map).map(function(k){return map[k]}).filter(function(b){return b.itemId===itemId})}
function sortFefo(a,b){return (a.opening?1:0)-(b.opening?1:0)||(a.expiry||'9999').localeCompare(b.expiry||'9999')}
function stockOf(itemId,map){return itemBatches(map||phBatches(),itemId).reduce(function(t,b){return t+b.qty},0)}

/* line maths: all rates are before GST; GST is added on the amount after discount */
function phCalc(type,l){
  var q=+l.qty||0, g=+l.gst||0;
  if(type==='Purchase'){var tx=r2(q*(+l.rate||0)),tax=r2(tx*g/100);return {gross:tx,disc:0,taxable:tx,tax:tax,total:r2(tx+tax)}}
  if(type==='Sale'||type==='Return'){var gross=r2(q*(+l.rate||0)),disc=r2(gross*Math.min(Math.max(+l.discPct||0,0),100)/100),taxable=r2(gross-disc),tax=r2(taxable*g/100);return {gross:gross,disc:disc,taxable:taxable,tax:tax,total:r2(taxable+tax)}}
  var v=r2(q*(+l.rate||0));return {gross:v,disc:0,taxable:v,tax:0,total:v};
}
function phTotals(type,lines,roundOn,manual){
  var t={subtotal:0,discount:0,taxable:0,tax:0};
  lines.forEach(function(l){if(!l.itemId)return;var c=phCalc(type,l);t.subtotal+=c.gross;t.discount+=c.disc;t.taxable+=c.taxable;t.tax+=c.tax});
  Object.keys(t).forEach(function(k){t[k]=r2(t[k])});
  t.raw=r2(t.taxable+t.tax);
  var canRound=type==='Purchase'||type==='Sale'||type==='Return';
  t.autoRound=r2(Math.round(t.raw)-t.raw);
  t.roundOff=canRound&&roundOn?(manual!=null&&manual!==''&&!isNaN(+manual)?r2(manual):t.autoRound):0;
  t.total=r2(t.raw+t.roundOff);
  return t;
}

/* pharmacy client accounts: sales are bills; receipts and returns are credits */
function phAllocate(){return allocate()}
function phSaleInfo(m,al){
  var paid;
  if(m.clientId){paid=r2((al||allocate()).paid[m.id]||0)}
  else{paid=r2(allReceipts().filter(function(r){return r.saleId===m.id}).reduce(function(t,r){return t+(+r.amount||0)},0))}
  var bal=r2((+m.total||0)-paid);
  return {paid:paid,bal:bal,status:bal<=0.004?'paid':(paid>0?'partial':'unpaid')};
}
function phClientAccount(cid,al){return clientAccount(cid,al)}
function phSupplierPayable(sid){
  var s=findIn('phSuppliers',sid)||{}, ob=+s.openingBal||0, pur=0;
  S.phMoves.forEach(function(m){if(m.type==='Purchase'&&m.supplierId===sid)pur+=+m.total||0});
  return {opening:r2(ob),purchases:r2(pur),net:r2(ob+pur)};
}

function phInvRows(unfiltered){
  var bm=phBatches(), q=norm(phInvF.q), mv={};
  S.phMoves.forEach(function(m){(m.lines||[]).forEach(function(l){var x=mv[l.itemId]=mv[l.itemId]||{i:0,o:0};if(PH_KIND[m.type]==='in')x.i+=+l.qty||0;else x.o+=+l.qty||0})});
  return S.phItems.slice().sort(function(a,b){return byText(a.name,b.name)}).map(function(it){
    var sr=phStockRec(bm,it.id), x=mv[it.id]||{i:0,o:0}, reorder=it.reorder===''||it.reorder==null?null:+it.reorder;
    return {item:it,opening:+it.openingQty||0,inQty:x.i,outQty:x.o,qty:sr.qty,rate:sr.rate,mrp:sr.mrp,value:r2(sr.qty*sr.rate),mrpValue:r2(sr.qty*sr.mrp),reorder:reorder,low:reorder!=null&&sr.qty<=reorder};
  }).filter(function(r){
    if(unfiltered) return true;
    if(phInvF.cat&&r.item.categoryId!==phInvF.cat) return false;
    if(q&&norm(r.item.name+' '+(r.item.hsn||'')).indexOf(q)<0) return false;
    if(phInvF.show==='instock') return r.qty>0;
    if(phInvF.show==='low') return r.low;
    if(phInvF.show==='out') return r.qty<=0;
    return true;
  });
}

function ledgerRows(dk,cid){
  var rows=[], c=clientById(cid)||{};
  var ob=+c.openingBal||0;
  if(ob>0) rows.push({date:String(c.createdAt||'').slice(0,10),ord:0,seq:0,part:'Opening balance',mod:'',ref:'',dr:c.obType==='Advance'?0:ob,cr:c.obType==='Advance'?ob:0});
  S.invoices.forEach(function(i){if(i.clientId===cid)rows.push({date:i.date,ord:1,seq:+i.seq||0,part:'Invoice',mod:'Spa',ref:i.no,open:'inv:'+i.id,dr:+i.total||0,cr:0})});
  S.phMoves.forEach(function(m){
    if(m.clientId!==cid) return;
    if(m.type==='Sale') rows.push({date:m.date,ord:1,seq:+m.seq||0,part:'Sale bill',mod:'Pharmacy',ref:m.no,open:'pm:'+m.id,dr:+m.total||0,cr:0});
    if(m.type==='Return') rows.push({date:m.date,ord:3,seq:+m.seq||0,part:'Items returned'+(m.saleNo?' against '+m.saleNo:''),mod:'Pharmacy',ref:m.no,open:'pm:'+m.id,dr:0,cr:+m.total||0});
  });
  S.aeInvoices.forEach(function(v){if(v.clientId===cid)rows.push({date:v.date,ord:1,seq:+v.seq||0,part:'Invoice',mod:'Aesthetics',ref:v.no,open:'ae:'+v.id,dr:+v.total||0,cr:0})});
  allReceipts().forEach(function(r){if(r.clientId===cid)rows.push({date:r.date,ord:2,seq:+r.seq||0,part:'Payment received ('+r.mode+')'+((r.invoiceNo||r.saleNo||r.aeInvNo)?' against '+(r.invoiceNo||r.saleNo||r.aeInvNo):' on account'),mod:'',ref:r.no,dr:0,cr:+r.amount||0})});
  rows.sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||a.ord-b.ord||a.seq-b.seq});
  var bal=0; rows.forEach(function(r){bal=r2(bal+r.dr-r.cr);r.bal=bal});
  return rows;
}

    rows.map(function(r){var ref=r.open?'<button class="link" data-'+(r.open.indexOf('inv:')===0?'inv':(r.open.indexOf('ae:')===0?'aeinv':'pm'))+'="'+esc(r.open.slice(r.open.indexOf(':')+1))+'">'+esc(r.ref)+'</button>':esc(r.ref||'—');

/* shrink a photo to a JPEG before storing it */
function shrinkPhoto(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
      var cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); cx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res({blob:b,canvas:c}):rej(new Error('encode'))},'image/jpeg',q);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('decode'))};
    img.src=url;
  });
}

   AESTHETICS: Invoices
   Lines come from unbilled work: a consultation (fee from the "Consultation"

function aiCalc(l){var amt=r2((+l.qty||0)*(+l.rate||0)),disc=r2(amt*Math.min(Math.max(+l.discPct||0,0),100)/100),net=r2(amt-disc),tax=r2(net*(+l.gst||0)/100);return {amount:amt,disc:disc,net:net,tax:tax,total:r2(net+tax)}}
function aiTotals(d){
  var t={amount:0,discount:0,net:0,tax:0};
  d.lines.forEach(function(l){if(!l.name)return;var c=aiCalc(l);t.amount+=c.amount;t.discount+=c.disc;t.net+=c.net;t.tax+=c.tax});
  Object.keys(t).forEach(function(k){t[k]=r2(t[k])});
  t.other=r2(+d.other||0); t.otherTax=r2(t.other*(+d.otherGst||0)/100);
  t.raw=r2(t.net+t.tax+t.other+t.otherTax);

  t.roundOff=d.roundOn?(d.roundManual!=null&&d.roundManual!==''&&!isNaN(+d.roundManual)?r2(d.roundManual):t.autoRound):0;
  t.total=r2(t.raw+t.roundOff);

}

function aiBilledMap(exceptId){
  var con={},ses={},pre={};
  S.aeInvoices.forEach(function(v){if(v.id===exceptId)return;(v.lines||[]).forEach(function(l){
    if(l.src==='con'&&l.srcId) con[l.srcId]=v.no;

  })});

/* a session is billed if it was invoiced on its own, or falls within sessions billed upfront on its quotation */
function sesBilling(s,bm){
  bm=bm||aiBilledMap();
  if(bm.ses[s.id]) return {billed:true,how:bm.ses[s.id]};
  var k=s.quoteId+'|'+s.quoteLineId, pre=bm.pre[k]||0; if(!pre) return {billed:false};

function aiQuoteRemaining(q,bm,d){
  return (q.lines||[]).map(function(l,i){
    var key=qtLineKey(q,l,i), k=q.id+'|'+key;
    var single=S.aeSessions.filter(function(s){return s.quoteId===q.id&&s.quoteLineId===key&&bm.ses[s.id]}).length;
    var inDraft=0; if(d) d.lines.forEach(function(x){if(x.quoteLineId===key&&x.quoteId===q.id)inDraft+=(x.src==='ses'?1:(+x.qty||0))});
    return {l:l,i:i,key:key,left:Math.max(0,(+l.sessions||0)-single-(bm.pre[k]||0)-inDraft)};
  });

function aiPending(d){

}

var DEPT_ISSUE={spa:'Spa Issue',aes:'Aesthetics Issue'};
function secQty(it){var n=+(it&&it.secQty);return n>0?Math.round(n):1}
function cleanCons(arr){return (arr||[]).filter(function(l){return l.itemId&&+l.qty>0}).map(function(l){return {itemId:l.itemId,name:l.name||(phItem(l.itemId)||{}).name||'',qty:r2(+l.qty)}})}
function copyCons(arr){return (arr||[]).map(function(l){return {itemId:l.itemId,name:l.name,qty:l.qty}})}
function secSplit(itemId,q){var it=phItem(itemId)||{},n=secQty(it);q=r2(q);if(n<=1||q<=0)return '';var f=Math.floor(q/n+1e-9),lo=r2(q-f*n);if(!f)return '';return f+' '+(it.unit||'pc')+(lo?' + '+lo:'')}
function fmtSec(itemId,q){var s=secSplit(itemId,q);return esc(String(r2(q)))+(s?' <span class="sub">('+esc(s)+')</span>':'')}
function deptUsages(dk){
  var out=[];
  if(dk==='aes'){
    S.aeSessions.forEach(function(s){if((s.consumables||[]).length)out.push({date:s.date,ref:s.no,client:s.clientName,what:s.procName||'Session',src:'Session',lines:s.consumables,rid:'ses:'+s.id})});
    S.aeCons.forEach(function(c){if((c.consumables||[]).length)out.push({date:c.date,ref:c.no,client:c.clientName,what:'Consultation',src:'Consultation',lines:c.consumables,rid:'con:'+c.id})});
  } else {
    S.invoices.forEach(function(v){(v.items||[]).forEach(function(it){if((it.consumables||[]).length)out.push({date:v.date,ref:v.no,client:v.clientName,what:it.name,src:'Invoice',lines:it.consumables,rid:'inv:'+v.id})})});
  }
  S.deptUsage.forEach(function(u){if(u.dept===dk)out.push({date:u.date,ref:u.no,client:'',what:u.note||'General use',src:'General use',lines:u.lines||[],rid:'use:'+u.id,usage:u})});
  return out;
}
/* every stock movement of a department, in secondary qty */
function deptMoves(dk){
  var out=[], issue=DEPT_ISSUE[dk];
  S.deptOpen.forEach(function(o){if(o.dept===dk&&+o.qty)out.push({date:o.date||'',ord:0,itemId:o.itemId,name:o.name,qty:+o.qty,kind:'opening',part:'Opening stock',ref:''})});
  S.phMoves.forEach(function(m){if(m.type!==issue)return;(m.lines||[]).forEach(function(l){out.push({date:m.date,ord:1,itemId:l.itemId,name:l.name,qty:r2((+l.qty||0)*secQty(phItem(l.itemId))),kind:'received',part:'Received from Pharmacy ('+(+l.qty||0)+' '+((phItem(l.itemId)||{}).unit||'pc')+')',ref:m.no})})});
  deptUsages(dk).forEach(function(u){(u.lines||[]).forEach(function(l){out.push({date:u.date,ord:2,itemId:l.itemId,name:l.name,qty:-r2(+l.qty||0),kind:'used',part:u.src==='General use'?'Used: '+u.what:'Used for '+u.what+(u.client?' · '+u.client:''),ref:u.ref})})});
  return out;
}
function deptStock(dk){
  var map={};
  deptMoves(dk).forEach(function(mv){var r=map[mv.itemId]=map[mv.itemId]||{itemId:mv.itemId,name:(phItem(mv.itemId)||{}).name||mv.name,opening:0,received:0,used:0,bal:0};
    if(mv.kind==='opening')r.opening=r2(r.opening+mv.qty);else if(mv.kind==='received')r.received=r2(r.received+mv.qty);else r.used=r2(r.used-mv.qty);r.bal=r2(r.bal+mv.qty)});

}

function qtLineKey(q,l,i){return l.lid||(q.id+':'+i)}
function qtLineStats(q,i){
  var l=q.lines[i], key=qtLineKey(q,l,i);
  var ap=S.aeAppts.filter(function(a){return a.quoteId===q.id&&a.quoteLineId===key});
  var ses=S.aeSessions.filter(function(x){return x.quoteId===q.id&&x.quoteLineId===key}), linked={};
  ses.forEach(function(x){if(x.apptId)linked[x.apptId]=1});
  /* a session record counts as done; a Completed appointment counts too unless a session record already covers it */
  var done=ses.length+ap.filter(function(a){return a.status==='Completed'&&!linked[a.id]}).length, booked=ap.filter(function(a){return AP_ACTIVE.indexOf(a.status)>=0&&!linked[a.id]}).length;
  return {key:key,done:done,booked:booked,left:Math.max(0,(+l.sessions||0)-done),open:Math.max(0,(+l.sessions||0)-done-booked),appts:ap,sessions:ses};
}
function qtUpcoming(q){var t=todayStr();return S.aeAppts.filter(function(a){return a.quoteId===q.id&&a.date>=t&&AP_ACTIVE.indexOf(a.status)>=0}).length}
function qtProgress(q){var t=0,dn=0;(q.lines||[]).forEach(function(l,i){t+=+l.sessions||0;dn+=qtLineStats(q,i).done});return {total:t,done:dn}}
function clientQuoteItems(cid){
  var out=[];
  S.aeQuotes.filter(function(q){return q.clientId===cid}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')}).forEach(function(q){
    (q.lines||[]).forEach(function(l,i){var st=qtLineStats(q,i);out.push({q:q,l:l,i:i,st:st,val:q.id+'|'+st.key})});
  });
  return out;
}
function apSessionLabel(a){
  if(!a.quoteId) return '';
  var q=findIn('aeQuotes',a.quoteId); if(!q) return a.quoteNo||'';
  var idx=-1; (q.lines||[]).forEach(function(l,i){if(qtLineKey(q,l,i)===a.quoteLineId)idx=i});
  if(idx<0) return q.no;
  var ap=qtLineStats(q,idx).appts.filter(function(x){return x.status!=='Cancelled'&&x.status!=='No-show'}).sort(function(x,y){return (x.date||'').localeCompare(y.date||'')||toMin(apFrom(x))-toMin(apFrom(y))});

}

function qtNew(){return {id:null,date:todayStr(),clientId:'',conId:'',lines:[qtBlankLine()],otherDesc:'',other:'',otherGst:18,roundOn:true,roundManual:null}}
function qtLine(l){var amt=r2((+l.sessions||0)*(+l.rate||0)),disc=r2(amt*Math.min(Math.max(+l.discPct||0,0),100)/100),net=r2(amt-disc),tax=r2(net*(+l.gst||0)/100);return {amount:amt,disc:disc,net:net,tax:tax,total:r2(net+tax)}}
function qtTotals(d){
  var t={amount:0,discount:0,net:0,tax:0};
  d.lines.forEach(function(l){if(!l.procId)return;var c=qtLine(l);t.amount+=c.amount;t.discount+=c.disc;t.net+=c.net;t.tax+=c.tax});
  Object.keys(t).forEach(function(k){t[k]=r2(t[k])});
  t.other=r2(+d.other||0); t.otherTax=r2(t.other*(+d.otherGst||0)/100);
  t.raw=r2(t.net+t.tax+t.other+t.otherTax);
  t.autoRound=r2(Math.round(t.raw)-t.raw);
  t.roundOff=d.roundOn?(d.roundManual!=null&&d.roundManual!==''&&!isNaN(+d.roundManual)?r2(d.roundManual):t.autoRound):0;
  t.total=r2(t.raw+t.roundOff);
  return t;
}

        '<p style="margin:8px 0 0"><button class="link" data-go="ae-inventory">Open Inventory</button></p>':'<p class="hint">Every consumable has at least one full unit left.</p>')+'</div></div>';

    b.innerHTML=html;
    $$('[data-ad-appt]',b).forEach(function(x){x.onclick=function(){if(!readOnly)editAppt(x.dataset.adAppt)}});
    $$('[data-ad-led]',b).forEach(function(x){x.onclick=function(){deptLedger('aes',x.dataset.adLed)}});
    var line=function(v){var p=v.split('|'),q=findIn('aeQuotes',p[0]),i=+p[1],l=q&&q.lines[i];return l?{q:q,l:l,i:i,key:qtLineKey(q,l,i)}:null};
    $$('[data-ad-book]',b).forEach(function(x){x.onclick=function(){var r=line(x.dataset.adBook);if(!r)return;editAppt(null,{type:'Procedure',clientId:r.q.clientId,clientName:r.q.clientName,procedureId:r.l.procId,procedureName:r.l.name,quoteId:r.q.id,quoteLineId:r.key,staffIds:qtStaff(r.q,r.key)})}});
    $$('[data-ad-cons]',b).forEach(function(x){x.onclick=function(){var r=line(x.dataset.adCons);if(r)openConsent(r.q.id,r.key)}});
  }
};

/* ---------- shell wiring ---------- */
var VIEWS={home:$('#view-home'),spa:$('#view-spa'),pha:$('#view-pha'),aes:$('#view-aes')}, notice=$('#notice');
function show(view){
  Object.keys(VIEWS).forEach(function(k){VIEWS[k].hidden=k!==view});
  window.scrollTo(0,0); closeModal();
  if(view==='spa'||view==='pha'||view==='aes'){
    $$('.work').forEach(function(w){w.innerHTML=''});
    dept=view; work=$('#work-'+view); go(lastKey[view]);
  }
}
$('#btn-spa').onclick=function(){notice.hidden=true;show('spa')};
$('#btn-pha').onclick=function(){notice.hidden=true;show('pha')};
$('#btn-aes').onclick=function(){notice.hidden=true;show('aes')};
$('#back-home-aes').onclick=function(){show('home')};
$('#notice-close').onclick=function(){notice.hidden=true};
$('#back-home').onclick=function(){show('home')};
$('#back-home-pha').onclick=function(){show('home')};
$$('.mi[data-key]').forEach(function(b){b.onclick=function(){go(b.dataset.key)}});
$$('.mgroup').forEach(function(t){var sub=$('#'+t.getAttribute('aria-controls'));t.onclick=function(){var open=t.getAttribute('aria-expanded')!=='true';t.setAttribute('aria-expanded',String(open));sub.hidden=!open}});

function roleKeys(){
  if(!CURRENT_USER||CURRENT_USER.role==='Admin'||CURRENT_USER.role==='Manager')return null;
  if(CURRENT_USER.role==='Spa')return ['dashboard','clients','services','categories','cities','states','invoice-form','invoices','receipts','outstanding','spa-inventory'];
  if(CURRENT_USER.role==='Aesthetics')return ['ae-dashboard','clients','cities','states','ae-proc-cats','ae-proc-master','ae-appointments','ae-consultations','ae-quotations','ae-sessions','ae-procedures','ae-invoices','ae-receipts','ae-outstanding','ae-inventory'];
  return ['ph-dashboard','clients','cities','states','ph-items','ph-item-categories','ph-suppliers','ph-item-in','ph-item-issue','ph-receipts','ph-outstanding','ph-inventory','ph-low-stock'];
}
function allowedDept(d){return !CURRENT_USER||CURRENT_USER.role==='Admin'||CURRENT_USER.role==='Manager'||(CURRENT_USER.role==='Spa'&&d==='spa')||(CURRENT_USER.role==='Aesthetics'&&d==='aes')||(CURRENT_USER.role==='Pharmacy'&&d==='pha')}
function applyRoleUI(){
  var keys=roleKeys();
  $$('.dept').forEach(function(b){b.hidden=!allowedDept(b.id==='btn-spa'?'spa':b.id==='btn-aes'?'aes':'pha')});
  $$('.mi[data-key]').forEach(function(b){b.closest('li').hidden=!!(keys&&keys.indexOf(b.dataset.key)<0)||(!CURRENT_USER||(!CURRENT_USER.role==='Admin'&&b.dataset.key==='business'));});
  if(CURRENT_USER&&CURRENT_USER.role!=='Admin')$$('.mi[data-key="business"]').forEach(function(b){b.closest('li').hidden=true});
  if(CURRENT_USER&&!['Admin','Manager'].includes(CURRENT_USER.role))$$('.mi[data-key="users"]').forEach(function(b){b.closest('li').hidden=true});
  $$('.mgroup').forEach(function(g){var sub=$('#'+g.getAttribute('aria-controls'));g.closest('li').hidden=!$$('li',sub).some(function(li){return !li.hidden});});
}
function authOverlay(message){
  var old=$('#auth-overlay');if(old)old.remove();
  document.body.insertAdjacentHTML('afterbegin','<style>#auth-overlay{position:fixed;inset:0;z-index:9999;background:#102022;display:grid;place-items:center;padding:20px}.auth-card{width:min(420px,100%);background:#fff;border-radius:16px;padding:28px;box-shadow:0 24px 80px #0008;color:#17262a}.auth-card h1{margin:0 0 8px}.auth-card label{display:block;margin:14px 0 5px;font-weight:700}.auth-card input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b7c5c3;border-radius:8px}.auth-card button{margin-top:18px;width:100%;padding:11px;background:#4f58c9;color:white;border:0;border-radius:8px;font-weight:700}.auth-error{color:#b42318;min-height:20px;margin-top:10px}</style><div id="auth-overlay"><form class="auth-card" id="login-form"><h1>Clinic Management</h1><p>Sign in to continue.</p><label>User ID</label><input id="login-user" autocomplete="username" required><label>Password</label><input id="login-pass" type="password" autocomplete="current-password" required><p class="auth-error">'+esc(message||'')+'</p><button>Sign in</button></form></div>');
  $('#login-form').onsubmit=function(e){e.preventDefault();var err=$('.auth-error',this);authCall('login',{userId:$('#login-user').value.trim(),password:$('#login-pass').value}).then(function(x){CURRENT_USER=x.user;$('#auth-overlay').remove();startApp();if(CURRENT_USER.mustChangePassword)passwordDialog();}).catch(function(e2){err.textContent=e2.message});};
}
function passwordDialog(){openModal('<h2>Change password</h2><form id="pw-form"><div class="field"><label>Current password</label><input id="pw-old" type="password" required></div><div class="field"><label>New password</label><input id="pw-new" type="password" minlength="8" required></div><p class="err" id="pw-err" hidden></p><div class="m-actions"><button class="btn primary">Save password</button></div></form>','--m10',false,function(m){m.querySelector('#pw-form').onsubmit=function(e){e.preventDefault();authCall('change_password',{oldPassword:m.querySelector('#pw-old').value,newPassword:m.querySelector('#pw-new').value}).then(function(){CURRENT_USER.mustChangePassword=false;closeModal();toast('Password updated');}).catch(function(x){var er=m.querySelector('#pw-err');er.textContent=x.message;er.hidden=false})}})}
function startApp(){applyRoleUI();$$('.side').forEach(function(nav){nav.insertAdjacentHTML('beforeend','<div class="sidebar-user"><span><strong>'+esc(CURRENT_USER.name)+'</strong>'+esc(CURRENT_USER.role)+'</span><button class="btn sm" data-logout>Logout</button></div>')});$$('[data-logout]').forEach(function(b){b.onclick=function(){authCall('logout').finally(function(){location.reload()})}});initStore();if(CURRENT_USER.role==='Spa')show('spa');else if(CURRENT_USER.role==='Aesthetics')show('aes');else if(CURRENT_USER.role==='Pharmacy')show('pha');else show('home');}
function initAuth(){authCall('me').then(function(x){CURRENT_USER=x.user;startApp();if(CURRENT_USER.mustChangePassword)passwordDialog();}).catch(function(){authOverlay();});}
initAuth();
})();
</script>
