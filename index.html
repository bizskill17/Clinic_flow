<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{if(sessionStorage.getItem('resume-v1'))document.documentElement.className+=' resuming'}catch(e){}</script>
<style>.resuming #view-home{visibility:hidden}.split-row{display:grid;grid-template-columns:minmax(90px,1fr) minmax(100px,1fr) minmax(100px,1fr) auto;gap:12px;align-items:end;margin-bottom:10px}.split-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.split-row>.btn{margin-bottom:2px}@media(max-width:600px){.split-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.split-row>.field:nth-child(3){grid-column:1/3;grid-row:2}.split-row>[data-sp-remove]{grid-column:3;grid-row:1/3}}
</style>
</head>
<body>
<title>Clinic Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: home = three department tiles; department view = coloured left menu + work area */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#f7f9f9; --ink:#17262a; --muted:#5d6d70; --line:#d9e2e0;
  --spa:#3f7a63; --spa-soft:#e3efe9;
  --aes:#a2516b; --aes-soft:#f5e6eb;
  --pha:#2f5f9e; --pha-soft:#e3ebf6;
  /* Spa menu colours */
  --m0:#b0397a; --m0-soft:#f8e2ee;   /* Dashboard */
  --m1:#0f7f8c; --m1-soft:#ddf1f3;   /* Clients */
  --m2:#7048b6; --m2-soft:#ece5f8;   /* Services */
  --m3:#b8740b; --m3-soft:#fbefd9;   /* Invoice Form */
  --m4:#2f62c4; --m4-soft:#e2eafb;   /* Invoices */
  --m5:#2f8a46; --m5-soft:#e0f2e5;   /* Receipts */
  --m6:#c2413b; --m6-soft:#fbe4e2;   /* Outstanding */
  --m7:#657a10; --m7-soft:#eef3d8;   /* Service Categories */
  --m8:#0a72ad; --m8-soft:#dff0fa;   /* Cities */
  --m9:#8b5a3c; --m9-soft:#f4e9e1;   /* States */
  --m10:#4f58c9; --m10-soft:#e5e7fa; /* Users */
  --m11:#c8551a; --m11-soft:#fbe8dc; /* Medicines */
  --m12:#12805c; --m12-soft:#ddf3ea; /* Manufacturers */
  --m13:#5c6b7a; --m13-soft:#e7ebef; /* Suppliers */
  --mg:#3d4f54; --mg-soft:#e6eceb;   /* Masters group */
  --on-color:#ffffff;
  --overlay:rgba(16,24,26,.45);
  --focus:#17262a;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101718; --surface:#172123; --surface-2:#1b2729; --ink:#e7eeec; --muted:#9aaaa9; --line:#2a3739;
  --spa:#7cc4a4; --spa-soft:#1d2f28; --aes:#e397ae; --aes-soft:#33212a; --pha:#8fb4ea; --pha-soft:#1c2738;
  --m0:#f08cc4; --m0-soft:#3a1d2d;
  --m1:#4cc3cf; --m1-soft:#163033; --m2:#b49af0; --m2-soft:#2a2340; --m3:#f0b552; --m3-soft:#3a2d16;
  --m4:#86a9f2; --m4-soft:#1e2a44; --m5:#72cf8c; --m5-soft:#1b3323; --m6:#f08a83; --m6-soft:#3d1f1d;
  --m7:#bcd166; --m7-soft:#2a3114; --m8:#6cc0ee; --m8-soft:#152c3a; --m9:#d6a27e; --m9-soft:#35261c; --m10:#9ea6f5; --m10-soft:#23264a; --m11:#f2a275; --m11-soft:#3b2216; --m12:#5fd0a7; --m12-soft:#153228; --m13:#aab8c6; --m13-soft:#232b33; --mg:#b9c7c5; --mg-soft:#243234;
  --on-color:#101718; --overlay:rgba(0,0,0,.6);
  --focus:#e7eeec; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101718; --surface:#172123; --surface-2:#1b2729; --ink:#e7eeec; --muted:#9aaaa9; --line:#2a3739;
  --spa:#7cc4a4; --spa-soft:#1d2f28; --aes:#e397ae; --aes-soft:#33212a; --pha:#8fb4ea; --pha-soft:#1c2738;
  --m0:#f08cc4; --m0-soft:#3a1d2d;
  --m1:#4cc3cf; --m1-soft:#163033; --m2:#b49af0; --m2-soft:#2a2340; --m3:#f0b552; --m3-soft:#3a2d16;
  --m4:#86a9f2; --m4-soft:#1e2a44; --m5:#72cf8c; --m5-soft:#1b3323; --m6:#f08a83; --m6-soft:#3d1f1d;
  --m7:#bcd166; --m7-soft:#2a3114; --m8:#6cc0ee; --m8-soft:#152c3a; --m9:#d6a27e; --m9-soft:#35261c; --m10:#9ea6f5; --m10-soft:#23264a; --m11:#f2a275; --m11-soft:#3b2216; --m12:#5fd0a7; --m12-soft:#153228; --m13:#aab8c6; --m13-soft:#232b33; --mg:#b9c7c5; --mg-soft:#243234;
  --on-color:#101718; --overlay:rgba(0,0,0,.6);
  --focus:#e7eeec; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.wrap.wide{max-width:1320px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;padding-block:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{height:48px;width:auto;max-width:180px;object-fit:contain;background:#fff;border-radius:10px;padding:4px 8px}#brand-name.biz{font-family:var(--display);font-size:22px;font-weight:400}
.mark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.brand-name{font-weight:600;letter-spacing:.01em}

/* Home */
.grid{margin-top:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.dept{--c:var(--spa);--soft:var(--spa-soft);
  appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 26px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;min-height:200px;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.dept.aes{--c:var(--aes);--soft:var(--aes-soft)}
.dept.pha{--c:var(--pha);--soft:var(--pha-soft)}
.dept:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 12px 28px -18px var(--c)}
.icon{width:56px;height:56px;border-radius:14px;background:var(--soft);color:var(--c);display:grid;place-items:center}
.icon svg{width:28px;height:28px}
.dept h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.notice{margin-top:24px;padding:16px 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Department view */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.back svg{width:16px;height:16px}
.dept-title{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px}
.dept-title .icon{width:40px;height:40px;border-radius:11px;background:var(--spa-soft);color:var(--spa)}
.dept-title .icon svg{width:22px;height:22px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start;margin-top:8px}
.side{max-height:calc(100vh - 200px);max-height:calc(100dvh - 200px);overflow-y:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.sidebar-user{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.su-card{background:color-mix(in srgb,var(--ink) 5%,var(--surface));border-radius:14px;padding:12px}.su-row{display:flex;align-items:center;gap:10px}.su-av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.03em}.su-who{min-width:0;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}.su-who strong{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}.su-role{margin-top:3px;font-size:11px;font-weight:700;color:var(--m5);background:color-mix(in srgb,var(--m5) 16%,transparent);border-radius:999px;padding:1px 8px}.su-out{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:inherit;font-weight:600;color:var(--m6);cursor:pointer;transition:background .15s}.su-out:hover{background:color-mix(in srgb,var(--m6) 8%,var(--surface))}
.side-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 10px 10px}
.menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.mi{--c:var(--m1);--soft:var(--m1-soft);
  width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;border:0;background:transparent;cursor:pointer;text-align:left;font-weight:500;
  transition:background .15s ease}
.mi:hover{background:var(--soft)}
.mi .chip{flex:none;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--c);display:grid;place-items:center;transition:background .15s ease,color .15s ease}
.mi .chip svg{width:18px;height:18px}
.it-std{display:block;font-size:12px;color:var(--m5);margin-top:3px;min-height:0}.it-std s{color:var(--muted)}.club-note{margin-top:6px;font-size:13px;color:var(--m4)}.totals .club-save span{color:var(--m5);font-weight:600}
.tile-btn{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .15s ease,transform .15s ease}.tile-btn:hover{background:color-mix(in srgb,var(--tc) 9%,var(--surface))}.tile-btn:active{transform:translateY(1px)}
.pw-wrap{position:relative}.pw-wrap input{padding-right:46px!important}.pw-wrap .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px!important;height:34px;min-height:0;padding:0!important;margin:0!important;border:0;border-radius:8px;background:transparent!important;color:#6b7775!important;display:grid;place-items:center;cursor:pointer}.pw-wrap .pw-eye:hover{background:#e3e8e6!important;color:#1f2a2c!important}
.wa-tag{margin-top:12px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,#25d366 8%,var(--surface));border:1px solid color-mix(in srgb,#25d366 25%,var(--line));font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.wa-tag .wa-ic{color:#1f9e55;display:inline-grid}.wa-tag .ok{color:#1f9e55;font-weight:600}.wa-tag .bad{color:var(--m6);font-weight:600}.wa-sws{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.wa-sw{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.wa-sw input{margin-top:3px;width:18px;height:18px;accent-color:#1f9e55}.wa-sw span{display:flex;flex-direction:column;gap:2px}.wa-cron{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wa-cron code,.panel code{background:color-mix(in srgb,var(--ink) 6%,var(--surface));padding:6px 8px;border-radius:6px;font-size:12px;word-break:break-all}
.pend-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.pend-sum{font-size:13px;color:var(--muted)}.pend-sum strong{color:var(--ink)}.pend-row{cursor:pointer}.pend-row:hover td{background:color-mix(in srgb,var(--ink) 3%,var(--surface))}.pend-row.zero td{color:var(--muted)}.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:10px;vertical-align:middle}.pcnt{display:inline-grid;min-width:28px;height:24px;place-items:center;border-radius:12px;padding:0 8px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--m6) 16%,transparent);color:var(--m6)}.pcnt.info{background:color-mix(in srgb,var(--m4) 16%,transparent);color:var(--m4)}.pend-row.zero .pcnt{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--muted)}.pcar{display:inline-block;color:var(--muted);transition:transform .15s}.pend-row.open .pcar{transform:rotate(90deg)}.pend-detail td{background:color-mix(in srgb,var(--ink) 3%,var(--surface));padding:0!important}.pin{padding:10px 14px 14px 30px}.pit{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}.pwho{flex:1;min-width:0;display:flex;flex-direction:column}.pamt{font-weight:600;color:var(--m6);white-space:nowrap}.age{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}.age.r{background:color-mix(in srgb,var(--m6) 16%,transparent);color:var(--m6)}.age.a{background:color-mix(in srgb,var(--m3) 18%,transparent);color:var(--m3)}.age.g{background:color-mix(in srgb,var(--m5) 16%,transparent);color:var(--m5)}
.nbadge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--m6);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}.mi[aria-current="page"] .nbadge{background:#fff;color:var(--m6)}
.pend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}.pend-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);border-left:5px solid var(--tc);background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);font:inherit}.pend-card .n{font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;order:2}.pend-card .l{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;order:1}.pend-card:hover{background:color-mix(in srgb,var(--tc) 8%,var(--surface))}.pend-card.on .l{color:var(--ink)}
.mi[aria-current="page"]{background:var(--c);color:var(--on-color)}
.mi[aria-current="page"] .chip{background:color-mix(in srgb,var(--on-color) 22%,transparent);color:var(--on-color)}
.mi.c0{--c:var(--m0);--soft:var(--m0-soft)}
.mi.c2{--c:var(--m2);--soft:var(--m2-soft)}
.mi.c3{--c:var(--m3);--soft:var(--m3-soft)}
.mi.c4{--c:var(--m4);--soft:var(--m4-soft)}
.mi.c5{--c:var(--m5);--soft:var(--m5-soft)}
.mi.c6{--c:var(--m6);--soft:var(--m6-soft)}
.mi.c7{--c:var(--m7);--soft:var(--m7-soft)}
.mi.c8{--c:var(--m8);--soft:var(--m8-soft)}
.mi.c9{--c:var(--m9);--soft:var(--m9-soft)}
.mi.c10{--c:var(--m10);--soft:var(--m10-soft)}
.mi.c11{--c:var(--m11);--soft:var(--m11-soft)}
.mi.c12{--c:var(--m12);--soft:var(--m12-soft)}
.mi.c13{--c:var(--m13);--soft:var(--m13-soft)}
.mi.cg{--c:var(--mg);--soft:var(--mg-soft)}
.mgroup .caret{margin-left:auto;width:16px;height:16px;transition:transform .15s ease}
.mgroup[aria-expanded="true"] .caret{transform:rotate(90deg)}
.mgroup.has-current{background:var(--soft)}
.submenu{list-style:none;margin:2px 0 4px 16px;padding:0 0 0 10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:2px}
.submenu .mi{padding:6px 8px;font-size:14px}
.submenu .mi .chip{width:28px;height:28px;border-radius:8px}
.submenu .mi .chip svg{width:16px;height:16px}

.work{--wc:var(--m0);--wsoft:var(--m0-soft);background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:480px;padding:24px 28px 28px;min-width:0;border-top:6px solid var(--wc)}
.w-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}
.w-head h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.2vw,32px);margin:0;line-height:1.15}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.banner{margin-bottom:14px;padding:10px 14px;border-radius:10px;background:var(--m3-soft);color:var(--ink);font-size:14px;border:1px solid var(--line)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--wc)}
.btn.primary{background:var(--wc);border-color:var(--wc);color:var(--on-color);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn.danger{color:var(--m6)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.modal input:disabled,.modal select:disabled{cursor:not-allowed!important;opacity:.55!important;color:var(--muted)!important}
.link{background:none;border:0;padding:0;color:var(--wc);font-weight:600;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:end}
.toolbar .field{flex:0 1 auto}
.toolbar .grow{flex:1 1 220px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field .req{color:var(--m6)}
input[type=text],input[type=password],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--wc);outline-offset:0;border-color:var(--wc)}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px 14px;align-items:start}
.field .hint{margin-top:2px;line-height:1.35}
.f-grid .span2{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.err{color:var(--m6);font-size:14px;font-weight:500}
.hint{color:var(--muted);font-size:13px}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
.row-acts{display:flex;gap:6px;justify-content:flex-end}
.sub{color:var(--muted);font-size:13px}
.due{color:var(--m6);font-weight:600}
.adv{color:var(--m5);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.paid{background:var(--m5-soft);color:var(--m5)}
.pill.partial{background:var(--m3-soft);color:var(--m3)}
.pill.unpaid{background:var(--m6-soft);color:var(--m6)}
.pill.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);border-left:5px solid var(--tc)}

function cancellationBlock(kind,doc){

  if(kind==='aeCons'&&aiBilledMap().con[doc.id])return 'Cancel the invoice billing this consultation first.';
  if(kind==='aeSessions'&&aiBilledMap().ses[doc.id])return 'Cancel the invoice billing this session first.';
  if(kind==='members'&&activeVouchers('redemptions').some(function(r){return r.memId===doc.id}))return 'Cancel the package redemptions first.';
  if(kind==='clubs'&&clubSavings(doc).length)return 'Cancel invoices using this membership first.';
  var refs={aeAppts:['apptId'],aeCons:['conId'],aeQuotes:['quoteId'],aeSessions:['sesId'],aeConsents:['consentId'],redemptions:['redId','redemptionId']};
  if(refs[kind]){

      var collection=VOUCHER_KINDS[k];
      var linked=activeVouchers(collection).find(function(r){return !(collection===kind&&r.id===doc.id)&&refs[kind].some(function(f){return r[f]===doc.id||(r.items||[]).concat(r.lines||[]).some(function(it){return it[f]===doc.id})})});

  if(kind==='phMoves'&&doc.type==='Sale'&&activeVouchers('phMoves').some(function(r){return r.type==='Return'&&r.saleId===doc.id}))return 'Cancel the linked sales returns first.';
  if(kind==='phMoves'){
    var before=phBatches(), spa=deptStock('spa'), aes=deptStock('aes'), after,sp2,ae2;
    var hadFlag=Object.prototype.hasOwnProperty.call(doc,"cancelled"),oldFlag=doc.cancelled;doc.cancelled=true;
    try{after=phBatches();sp2=deptStock('spa');ae2=deptStock('aes')}finally{if(hadFlag)doc.cancelled=oldFlag;else delete doc.cancelled}
    if(Object.keys(after).some(function(k){return after[k].qty<Math.min(0,(before[k]||{}).qty||0)-0.00001})||[[spa,sp2],[aes,ae2]].some(function(pair){return Object.keys(pair[1]).some(function(k){return pair[1][k].bal<Math.min(0,(pair[0][k]||{}).bal||0)-0.00001})}))return 'Stock from this voucher has been used. Cancel the related issues or consumption first.';

/* Payments belong to a client. A receipt may name an invoice (it settles that invoice first);
   anything left over, and every receipt with no invoice, settles that client's oldest unpaid invoices.
   Whatever is still left is the client's advance. */
/* A client's opening balance: Receivable acts like the oldest invoice; Advance starts their credit. */
function openingItems(){
  return S.clients.filter(function(c){return (+c.openingBal||0)>0&&c.obType!=='Advance'}).map(function(c){
    return {id:'ob:'+c.id,no:'Opening balance',opening:true,date:String(c.createdAt||'').slice(0,10)||todayStr(),seq:-1,clientId:c.id,clientName:c.name,clientPhone:c.phone,total:r2(c.openingBal)};
  });
}
function allInvoices(){return openingItems().concat(activeVouchers('invoices'))}
function allocCore(invs,recs,pool){
  var paid={},invMap={},byClient={};
  invs.forEach(function(i){paid[i.id]=0;invMap[i.id]=i;(byClient[i.clientId]=byClient[i.clientId]||[]).push(i)});
  recs.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||(+a.seq||0)-(+b.seq||0)}).forEach(function(r){
    var amt=+r.amount||0, inv=r.invoiceId&&invMap[r.invoiceId];
    if(inv){var room=r2((+inv.total||0)-paid[inv.id]),use=Math.max(0,Math.min(room,amt));paid[inv.id]=r2(paid[inv.id]+use);amt=r2(amt-use)}
    var cid=r.clientId||(inv&&inv.clientId)||''; pool[cid]=r2((pool[cid]||0)+amt);
  });
  Object.keys(byClient).forEach(function(cid){
    byClient[cid].slice().sort(function(a,b){return (b.opening?1:0)-(a.opening?1:0)||(a.date||'').localeCompare(b.date||'')||(+a.seq||0)-(+b.seq||0)}).forEach(function(i){
      var room=r2((+i.total||0)-paid[i.id]); if(room>0&&(pool[cid]||0)>0){var use=Math.min(room,pool[cid]);paid[i.id]=r2(paid[i.id]+use);pool[cid]=r2(pool[cid]-use)}
    });
  });
  return {paid:paid,advance:pool};
}
/* One account per client across Spa, Pharmacy and Aesthetics.
   Bills: opening receivable, Spa invoices, Pharmacy sale bills (walk-in sales excluded).
   Credits: every receipt (Spa or Pharmacy), Pharmacy returns, and an advance opening balance. */
function allBills(){

function openList(key,f,from,extra){return function(){f.q='';f.from=from;f.to=todayStr();if(extra)extra(f);go(key)}}
function hbar(label,val,frac,c,rawLabel){return '<div class="hbar" style="--hc:var('+c+')"><span>'+(rawLabel?label:esc(label))+'</span><span class="num">'+esc(val)+'</span><div class="track"><div class="fill" style="width:'+Math.max(2,Math.round(frac*100))+'%"></div></div></div>'}
function barChart(days,vals,today){
  var W=560,H=200,pl=8,pr=8,pt=22,pb=30,n=days.length,max=Math.max.apply(null,vals.concat([0]));
  var cw=(W-pl-pr)/n,bw=cw*0.62,ih=H-pt-pb;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily sales for the last 14 days"><line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  if(max>0) s+='<line class="grid-l" stroke-dasharray="3 4" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+pt+'" y2="'+pt+'"/><text class="lbl" x="'+pl+'" y="'+(pt-7)+'">'+esc(money0(max))+'</text>';
  days.forEach(function(d,i){
    var v=vals[i],h=max>0?Math.max(v>0?3:0,v/max*ih):0,x=pl+i*cw+(cw-bw)/2,y=H-pb-h;
    s+='<rect class="bar'+(d===today?' today':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"><title>'+esc(fmtDate(d)+': '+money(v))+'</title></rect>';
    if(i%2===1||d===today){var dt=parseD(d);s+='<text class="lbl" text-anchor="middle" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-pb+17)+'">'+dt.getDate()+' '+dt.toLocaleDateString('en-IN',{month:'short'})+'</text>'}
  });
  return s+'</svg>'+(max===0?'<p class="hint" style="margin:6px 0 0">No sales in the last 14 days.</p>':'');
}

function clientStats(){
  var al=allocate(),st={};
  S.clients.forEach(function(c){var a=clientAccount(c.id,al);st[c.id]={n:0,last:'',billed:a.billed,received:a.received,due:a.due,advance:a.advance,acct:a}});
  activeVouchers('invoices').forEach(function(i){var s=st[i.clientId];if(!s)return;s.n++;if((i.date||'')>s.last)s.last=i.date});
  return st;
}

function deleteClient(id){
  var c=clientById(id); if(!c) return;
  if(activeVouchers('invoices').some(function(i){return i.clientId===id})||activeVouchers('receipts').some(function(r){return r.clientId===id})||activeVouchers('phMoves').some(function(m){return m.clientId===id})||activeVouchers('phReceipts').some(function(r){return r.clientId===id})){toast(c.name+' has invoices or receipts, so the record can’t be deleted.');return}
  confirmBox('Delete client?','Delete '+c.name+' ('+c.phone+')? This can’t be undone.','Delete client',function(){
    remove('clients',id).then(function(){toast('Client deleted')}).catch(function(e){toast(errText(e))});
  });
}

function combo(host,cfg){
  host.innerHTML='<div class="combo"><input type="text" class="combo-in" id="'+cfg.id+'" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" placeholder="'+esc(cfg.placeholder||'Select')+'"'+(cfg.label?' aria-label="'+esc(cfg.label)+'"':'')+'><svg class="combo-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><ul class="combo-list" role="listbox" hidden></ul></div>';
  var input=host.querySelector('input'), list=host.querySelector('ul'), val=cfg.value||'', act=-1, shown=[];
  function labelOf(v){var o=cfg.options().find(function(o){return o[0]===v});return o?o[1]:(v&&cfg.missing?cfg.missing(v):'')}
  function setText(){input.value=labelOf(val)}
  function hl(){$$('li[data-i]',list).forEach(function(li,ix){li.classList.toggle('act',ix===act);if(ix===act)li.scrollIntoView({block:'nearest'})})}
  function open(filter){
    var q=norm(filter);
    shown=cfg.options().filter(function(o){return !q||norm(o[1]+' '+(o[2]||'')).indexOf(q)>=0}).slice(0,150);
    list.innerHTML=shown.length?shown.map(function(o,ix){return '<li role="option" data-i="'+ix+'"'+(o[0]===val?' class="sel" aria-selected="true"':'')+'>'+esc(o[1])+(o[2]?' <span class="sub">'+esc(o[2])+'</span>':'')+'</li>'}).join(''):'<li class="none">'+esc(q?'No matches':(cfg.emptyText||'Nothing to choose yet'))+'</li>';
    list.hidden=false; input.setAttribute('aria-expanded','true'); act=q&&shown.length?0:-1; hl();
  }
  function close(){if(list.hidden)return;list.hidden=true;input.setAttribute('aria-expanded','false');setText()}
  function pick(ix){var o=shown[ix];if(!o)return;val=o[0];list.hidden=true;input.setAttribute('aria-expanded','false');setText();cfg.onChange(val)}
  input.addEventListener('focus',function(){open('');input.select()});
  input.addEventListener('click',function(){if(list.hidden)open('')});
  input.addEventListener('input',function(){open(input.value)});
  input.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();if(list.hidden)open('');act=Math.min(act+1,shown.length-1);hl()}
    else if(e.key==='ArrowUp'){e.preventDefault();act=Math.max(act-1,0);hl()}
    else if(e.key==='Enter'){if(!list.hidden){e.preventDefault();pick(act>=0?act:0)}}
    else if(e.key==='Escape'){if(!list.hidden){e.stopPropagation();close()}}
    else if(e.key==='Tab'){close()}
  });
  input.addEventListener('blur',function(){setTimeout(function(){
    if(cfg.allowEmpty&&!input.value.trim()&&val){val='';cfg.onChange('')}
    close();
  },120)});
  list.addEventListener('mousedown',function(e){var li=e.target.closest('li[data-i]');e.preventDefault();if(li)pick(+li.dataset.i)});
  setText();
  return {set:function(v){val=v;setText()},refresh:function(){if(list.hidden&&document.activeElement!==input)setText()},el:input};
}

/* Shared split-payment editor and receipt writer. Amounts remain in separate receipts. */
function splitRows(d){
  if(!d.payments)d.payments=[{amount:d.payAmount||'',mode:d.payMode||'Cash',reference:d.payRef||''}];
  return d.payments;
}
function splitTotal(d){return r2(splitRows(d).reduce(function(t,p){return t+r2(p.amount)},0))}
function splitError(d,required){
  var rows=splitRows(d),msg='';
  rows.some(function(p,i){
    var used=String(p.amount==null?'':p.amount).trim()!=='';
    if((used&&(!Number.isFinite(+p.amount)||+p.amount<=0))||(!used&&String(p.reference||'').trim())){msg='Enter an amount greater than zero for payment '+(i+1)+'.';return true}
    if(used&&MODES.indexOf(p.mode)<0){msg='Choose a payment mode for payment '+(i+1)+'.';return true}
  });
  return msg||(required&&!(splitTotal(d)>0)?'Enter at least one payment greater than zero.':'');
}
function mountSplit(host,d,totalFn){
  if(!host)return;
  var rows=splitRows(d);
  function summary(){
    d.payAmount=String(splitTotal(d));
    var total=r2(totalFn()),received=splitTotal(d),balance=r2(Math.max(0,total-received)),advance=r2(Math.max(0,received-total));
    var box=host.querySelector('[data-split-summary]');if(!box)return;
    box.innerHTML='<span>Invoice / balance due <strong>'+money(total)+'</strong></span><span>Total received <strong>'+money(received)+'</strong></span><span>Balance <strong>'+money(balance)+'</strong></span>'+
      (advance>0?'<span>Advance <strong>'+money(advance)+'</strong></span>':'')+
      '<span class="pill '+(balance<=0.004?'paid':(received>0?'partial':'unpaid'))+'">'+(balance<=0.004?'Paid':(received>0?'Partially paid':'Unpaid'))+'</span>';
  }
  function draw(){
    host.innerHTML='<div class="split-rows">'+rows.map(function(p,i){return '<div class="split-row" data-split-row="'+i+'"><div class="field"><label>Amount (₹)</label><input aria-label="Payment '+(i+1)+' amount" data-sp-amount type="number" min="0.01" step="0.01" placeholder="0.00" value="'+esc(p.amount)+'"></div><div class="field"><label>Payment mode</label><select aria-label="Payment '+(i+1)+' mode" data-sp-mode>'+optList(MODES,p.mode)+'</select></div><div class="field"><label>Reference</label><input aria-label="Payment '+(i+1)+' reference" data-sp-ref placeholder="Optional" value="'+esc(p.reference)+'"></div><button type="button" class="btn sm danger" data-sp-remove aria-label="Remove payment '+(i+1)+'">×</button></div>'}).join('')+'</div><div class="split-actions"><button type="button" class="btn sm" data-sp-add>+ Add Payment</button><button type="button" class="btn sm" data-sp-full>Paid in full</button></div><div class="mem-sum" data-split-summary aria-live="polite"></div>';
    host.querySelectorAll('[data-split-row]').forEach(function(row){
      var i=+row.dataset.splitRow;
      row.querySelector('[data-sp-amount]').oninput=function(e){rows[i].amount=e.target.value;summary()};
      row.querySelector('[data-sp-mode]').onchange=function(e){rows[i].mode=e.target.value;summary()};
      row.querySelector('[data-sp-ref]').oninput=function(e){rows[i].reference=e.target.value};
      row.querySelector('[data-sp-remove]').onclick=function(){rows.splice(i,1);if(!rows.length)rows.push({amount:'',mode:'Cash',reference:''});draw()};
    });
    host.querySelector('[data-sp-add]').onclick=function(){rows.push({amount:'',mode:'Cash',reference:''});draw();var inputs=host.querySelectorAll('[data-sp-amount]');inputs[inputs.length-1].focus()};
    host.querySelector('[data-sp-full]').onclick=function(){
      var prior=rows.slice(0,-1).reduce(function(t,p){return t+(+p.amount||0)},0);
      rows[rows.length-1].amount=String(r2(Math.max(0,totalFn()-prior)));if(+rows[rows.length-1].amount===0)rows[rows.length-1].amount='';draw();
    };
    summary();
  }
  host._splitSummary=summary;draw();
  return {setAmount:function(amount){rows.splice(0,rows.length,{amount:amount||'',mode:'Cash',reference:''});draw()},refresh:summary};
}
function refreshSplit(id){var h=document.getElementById(id);if(h&&h._splitSummary)h._splitSummary()}
function writeSplitReceipts(d,base){
  var msg=splitError(d,false);if(msg)return Promise.reject(new Error(msg));
  var payments=splitRows(d).filter(function(p){return +p.amount>0}),seq=nextReceiptNo().seq,created=[],chain=Promise.resolve();
  if(CURRENT_USER&&DB&&payments.length){
    if(payments.length>1000)return Promise.reject(new Error('A payment can have at most 1000 rows.'));
    var records=payments.map(function(p,i){return Object.assign({},base,{id:newId('r'),seq:seq+i,no:'RCT-'+pad(seq+i),amount:r2(p.amount),mode:p.mode,reference:String(p.reference||'').trim()})});
    return authCall('bulk',{collection:COL.receipts,records:records.map(function(r){var data=Object.assign({},r);delete data.id;return {id:r.id,data:data}})}).then(function(){records.forEach(function(r){S.receipts.push(r);waOnSaved('receipts',r)});scheduleRefresh()});
  }
  payments.forEach(function(p,i){chain=chain.then(function(){
    var r=Object.assign({},base,{id:newId('r'),seq:seq+i,no:'RCT-'+pad(seq+i),amount:r2(p.amount),mode:p.mode,reference:String(p.reference||'').trim()});
    return put('receipts',r).then(function(){created.push(r)});
  })});
  return chain.catch(function(e){
    return Promise.all(created.map(function(r){return removeRaw('receipts',r.id)})).then(function(){throw e});
  });
}

function lineCalc(it,mp){var gross=r2((+it.qty||0)*(+it.rate||0)),pct=Math.min(Math.max(+it.discPct||0,0),100),disc=r2(gross*pct/100),after=r2(gross-disc),md=mp?r2(after*mp/100):0,amt=r2(after-md),tax=r2(amt*(+it.gst||0)/100);return {gross:gross,disc:disc,memDisc:md,amount:amt,tax:tax,total:r2(amt+tax)}}

function uploadLogo(file,errEl){
  var fail=function(t){if(errEl){errEl.textContent=t;errEl.hidden=false}else toast(t)};
  if(errEl) errEl.hidden=true;
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)) return fail('Choose a PNG or JPG image.');
  if(file.size>8*1024*1024) return fail('That image is larger than 8 MB. Choose a smaller file.');
  var rd=new FileReader();
  rd.onerror=function(){fail('The image could not be read.')};
  rd.onload=function(){
    var img=new Image();
    img.onerror=function(){fail('The image could not be opened.')};
    img.onload=function(){
      var max=480, r=Math.min(1,max/img.width,max/img.height), w=Math.max(1,Math.round(img.width*r)), h=Math.max(1,Math.round(img.height*r));
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
      var data=cv.toDataURL('image/png'), fmt='PNG';
      if(data.length>180000){cx.globalCompositeOperation='destination-over';cx.fillStyle='#ffffff';cx.fillRect(0,0,w,h);data=cv.toDataURL('image/jpeg',0.85);fmt='JPEG'}
      if(data.length>230000) return fail('The logo is too detailed to store. Try a simpler or smaller image.');
      put('business',{id:'logo',data:data,w:w,h:h,fmt:fmt,updatedAt:new Date().toISOString()}).then(function(){toast('Logo saved');bizDirty=false;SECTIONS.business.update()}).catch(function(e){fail(errText(e))});
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

   PHARMACY OPERATIONS: Item In, Item Issue, Receipts
   ========================================================= */
var PH_PREFIX={Purchase:'PUR',Return:'SRN',Sale:'SAL',Expiry:'EXP',Damage:'DMG','Spa Issue':'SPI','Aesthetics Issue':'AEI'};
var PH_KIND={Purchase:'in',Return:'in',Sale:'out',Expiry:'out',Damage:'out','Spa Issue':'out','Aesthetics Issue':'out'};
var PH_TYPE_PILL={Purchase:'paid',Return:'partial',Sale:'paid',Expiry:'unpaid',Damage:'unpaid','Spa Issue':'off','Aesthetics Issue':'off'};
function phItem(id){return findIn('phItems',id)}
function lotLabel(b){return b.opening||b.batch==='OPENING'?'Opening stock':(b.expiry?'Exp '+fmtExp(b.expiry):(b.batch&&b.batch!=='NOEXP'?b.batch:'No expiry'))}
function phMove(id){return findIn('phMoves',id)}
function fmtExp(e){if(!e)return '';var p=String(e).split('-');return p.length>=2?p[1]+'/'+p[0]:e}
function expDays(e){if(!e)return null;var p=String(e).split('-').map(Number);var last=new Date(p[0],p[1],0);var t=nowIST();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((last-t)/86400000)}
function phNextNo(type){var seq=nextSeq(S.phMoves.filter(function(m){return m.type===type}));return {seq:seq,no:PH_PREFIX[type]+'-'+pad(seq)}}
function phPartyName(m){
  if(m.type==='Purchase') return m.supplierName||(findIn('phSuppliers',m.supplierId)||{}).name||'';
  if(m.type==='Sale'||m.type==='Return') return m.clientName||m.customerName||'Walk-in customer';
  return '';
}
/* stock by batch; excludeId leaves one document out (used while editing it) */
function phBatches(excludeId){
  /* one stock record per item: opening + Item In - Item Issue; keeps the latest purchase rate and MRP */
  var m={};
  function get(itemId){var k=itemId+'|ALL';return m[k]=m[k]||{key:k,itemId:itemId,batch:'ALL',mrp:0,rate:0,qty:0,lastDate:''}}
  S.phItems.forEach(function(i){var q=+i.openingQty||0,rt=+i.openingRate||0;if(q||rt){var b=get(i.id);b.qty+=q;if(rt)b.rate=rt}});
  activeVouchers('phMoves').slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'')}).forEach(function(mv){
    if(mv.id===excludeId||mv.cancelled) return;
    (mv.lines||[]).forEach(function(l){
      var b=get(l.itemId), q=+l.qty||0;
      if(PH_KIND[mv.type]==='in'){b.qty+=q;if(mv.type==='Purchase'&&(mv.date||'')>=b.lastDate){b.mrp=+l.mrp||b.mrp;b.rate=+l.rate||b.rate;b.lastDate=mv.date||''}}
      else b.qty-=q;
    });
  });
  return m;
}
function phStockRec(map,itemId){return map[itemId+'|ALL']||{qty:0,mrp:0,rate:0}}
function itemBatches(map,itemId){return Object.keys(map).map(function(k){return map[k]}).filter(function(b){return b.itemId===itemId})}
function sortFefo(a,b){return (a.opening?1:0)-(b.opening?1:0)||(a.expiry||'9999').localeCompare(b.expiry||'9999')}
function stockOf(itemId,map){return itemBatches(map||phBatches(),itemId).reduce(function(t,b){return t+b.qty},0)}

/* line maths: all rates are before GST; GST is added on the amount after discount */
function phCalc(type,l){
  var q=+l.qty||0, g=+l.gst||0;
  if(type==='Purchase'){var tx=r2(q*(+l.rate||0)),tax=r2(tx*g/100);return {gross:tx,disc:0,taxable:tx,tax:tax,total:r2(tx+tax)}}
  if(type==='Sale'||type==='Return'){var gross=r2(q*(+l.rate||0)),disc=r2(gross*Math.min(Math.max(+l.discPct||0,0),100)/100),taxable=r2(gross-disc),tax=r2(taxable*g/100);return {gross:gross,disc:disc,taxable:taxable,tax:tax,total:r2(taxable+tax)}}
  var v=r2(q*(+l.rate||0));return {gross:v,disc:0,taxable:v,tax:0,total:v};
}
function phTotals(type,lines,roundOn,manual){
  var t={subtotal:0,discount:0,taxable:0,tax:0};
  lines.forEach(function(l){if(!l.itemId)return;var c=phCalc(type,l);t.subtotal+=c.gross;t.discount+=c.disc;t.taxable+=c.taxable;t.tax+=c.tax});
  Object.keys(t).forEach(function(k){t[k]=r2(t[k])});
  t.raw=r2(t.taxable+t.tax);
  var canRound=type==='Purchase'||type==='Sale'||type==='Return';
  t.autoRound=r2(Math.round(t.raw)-t.raw);
  t.roundOff=canRound&&roundOn?(manual!=null&&manual!==''&&!isNaN(+manual)?r2(manual):t.autoRound):0;
  t.total=r2(t.raw+t.roundOff);
  return t;
}

/* pharmacy client accounts: sales are bills; receipts and returns are credits */
function phAllocate(){return allocate()}
function phSaleInfo(m,al){
  if(m.cancelled) return {paid:0,bal:0,status:'cancelled'};
  var paid;
  if(m.clientId){paid=r2((al||allocate()).paid[m.id]||0)}
  else{paid=r2(allReceipts().filter(function(r){return r.saleId===m.id}).reduce(function(t,r){return t+(+r.amount||0)},0))}
  var bal=r2((+m.total||0)-paid);
  return {paid:paid,bal:bal,status:bal<=0.004?'paid':(paid>0?'partial':'unpaid')};
}
function phClientAccount(cid,al){return clientAccount(cid,al)}
function phSupplierPayable(sid){
  var s=findIn('phSuppliers',sid)||{}, ob=+s.openingBal||0, pur=0, paid=0;
  activeVouchers('phMoves').forEach(function(m){if(m.type==='Purchase'&&m.supplierId===sid)pur+=+m.total||0});
  activeVouchers('phPays').forEach(function(p){if(p.supplierId===sid)paid+=+p.amount||0});
  return {opening:r2(ob),purchases:r2(pur),paid:r2(paid),net:r2(ob+pur-paid)};
}

function ledgerRows(dk,cid){
  var rows=[], c=clientById(cid)||{};
  var ob=+c.openingBal||0;
  if(ob>0) rows.push({date:String(c.createdAt||'').slice(0,10),ord:0,seq:0,part:'Opening balance',mod:'',ref:'',dr:c.obType==='Advance'?0:ob,cr:c.obType==='Advance'?ob:0});
  activeVouchers('invoices').forEach(function(i){if(i.clientId===cid)rows.push({date:i.date,ord:1,seq:+i.seq||0,part:'Invoice',mod:'Spa',ref:i.no,open:'inv:'+i.id,dr:+i.total||0,cr:0})});
  activeVouchers('phMoves').forEach(function(m){
    if(m.clientId!==cid) return;
    if(m.type==='Sale') rows.push({date:m.date,ord:1,seq:+m.seq||0,part:'Sale bill',mod:'Pharmacy',ref:m.no,open:'pm:'+m.id,dr:+m.total||0,cr:0});
    if(m.type==='Return') rows.push({date:m.date,ord:3,seq:+m.seq||0,part:'Items returned'+(m.saleNo?' against '+m.saleNo:''),mod:'Pharmacy',ref:m.no,open:'pm:'+m.id,dr:0,cr:+m.total||0});
  });
  activeVouchers('aeInvoices').forEach(function(v){if(v.clientId===cid)rows.push({date:v.date,ord:1,seq:+v.seq||0,part:'Invoice',mod:'Aesthetics',ref:v.no,open:'ae:'+v.id,dr:+v.total||0,cr:0})});
  allReceipts().forEach(function(r){if(r.clientId===cid)rows.push({date:r.date,ord:2,seq:+r.seq||0,part:r.memId?'Package '+(r.memNo||'')+' ('+r.mode+')':'Payment received ('+r.mode+')'+((r.invoiceNo||r.saleNo||r.aeInvNo)?' against '+(r.invoiceNo||r.saleNo||r.aeInvNo):' on account'),mod:'',ref:r.no,dr:0,cr:+r.amount||0})});
  rows.sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||a.ord-b.ord||a.seq-b.seq});

}

        var busy=apBusy(d,st.staffIds,id), f=st.from?toMin(st.from):null, t=st.to?toMin(st.to):null, html='';
        var today=todayStr(), nowM=(function(){var n=nowIST();return n.getHours()*60+n.getMinutes()})();

        if(first>=SLOT_END){box.innerHTML='<p class="hint" style="margin:0">No slots are left today. Choose another date, or type the From and To times to record a past appointment.</p>';return}
        for(var mm=first;mm<SLOT_END;mm+=SLOT_STEP){
          var taken=busy.filter(function(b){return mm<b.to&&mm+SLOT_STEP>b.from});
          var inSel=f!=null&&((t!=null&&mm>=f&&(mm<=t-SLOT_STEP||(mm===t&&t-f>SLOT_STEP)))||(t==null&&mm===f));

        }
        if(!st.staffIds.length) return show('Choose at least one doctor or staff member.');
        if(!d) return show('Choose the date.');

function shrinkPhoto(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
      var cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); cx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res({blob:b,canvas:c}):rej(new Error('encode'))},'image/jpeg',q);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('decode'))};
    img.src=url;
  });
}

   AESTHETICS: Invoices
   Lines come from unbilled work: a consultation (fee from the "Consultation"

function qtLineKey(q,l,i){return l.lid||(q.id+':'+i)}
function qtLineStats(q,i){
  var l=q.lines[i], key=qtLineKey(q,l,i);
  var ap=activeVouchers('aeAppts').filter(function(a){return a.quoteId===q.id&&a.quoteLineId===key});
  var ses=activeVouchers('aeSessions').filter(function(x){return x.quoteId===q.id&&x.quoteLineId===key}), linked={};
  ses.forEach(function(x){if(x.apptId)linked[x.apptId]=1});
  /* a session record counts as done; a Completed appointment counts too unless a session record already covers it */
  var done=ses.length+ap.filter(function(a){return a.status==='Completed'&&!linked[a.id]}).length, booked=ap.filter(function(a){return AP_ACTIVE.indexOf(a.status)>=0&&!linked[a.id]}).length;
  return {key:key,done:done,booked:booked,left:Math.max(0,(+l.sessions||0)-done),open:Math.max(0,(+l.sessions||0)-done-booked),appts:ap,sessions:ses};
}
function qtUpcoming(q){var t=todayStr();return activeVouchers('aeAppts').filter(function(a){return a.quoteId===q.id&&a.date>=t&&AP_ACTIVE.indexOf(a.status)>=0}).length}
function qtProgress(q){var t=0,dn=0;(q.lines||[]).forEach(function(l,i){t+=+l.sessions||0;dn+=qtLineStats(q,i).done});return {total:t,done:dn}}

function apSessionLabel(a){
  if(!a.quoteId) return '';

  var ap=qtLineStats(q,idx).appts.filter(function(x){return x.status!=='Cancelled'&&x.status!=='No-show'}).sort(function(x,y){return (x.date||'').localeCompare(y.date||'')||toMin(apFrom(x))-toMin(apFrom(y))});

function qtTotals(d){
  var t={amount:0,discount:0,net:0,tax:0};
  d.lines.forEach(function(l){if(!l.procId)return;var c=qtLine(l);t.amount+=c.amount;t.discount+=c.disc;t.net+=c.net;t.tax+=c.tax});
  Object.keys(t).forEach(function(k){t[k]=r2(t[k])});
  t.other=r2(+d.other||0); t.otherTax=r2(t.other*(+d.otherGst||0)/100);
  t.raw=r2(t.net+t.tax+t.other+t.otherTax);
  t.autoRound=r2(Math.round(t.raw)-t.raw);
  t.roundOff=d.roundOn?(d.roundManual!=null&&d.roundManual!==''&&!isNaN(+d.roundManual)?r2(d.roundManual):t.autoRound):0;
  t.total=r2(t.raw+t.roundOff);
  return t;
}
function qtLinesFromCon(c){
  var lines=(c&&c.procs||[]).map(function(p){var pr=findIn('aeProcs',p.procId)||{};return {lid:newId('ql'),procId:p.procId,name:p.name||pr.name||'',sac:pr.sac||'',sessions:+p.sessions||1,rate:pr.price!=null&&pr.price!==''?+pr.price:(+p.price||0),discPct:0,gst:pr.gst!=null?+pr.gst:(+p.gst||0)}});
  return lines.length?lines:[qtBlankLine()];
}

var ssF={q:'',show:'pending'};
function ssRows(){
  var t=todayStr(), out=[];
  activeVouchers('aeQuotes').forEach(function(q){(q.lines||[]).forEach(function(l,i){
    var st=qtLineStats(q,i), total=+l.sessions||0;
    var up=st.appts.filter(function(a){return a.date>=t&&AP_ACTIVE.indexOf(a.status)>=0}).sort(function(a,b){return (a.date+apFrom(a)).localeCompare(b.date+apFrom(b))});
    out.push({q:q,l:l,i:i,st:st,total:total,upcoming:up.length,next:up[0]||null});
  })});
  var qq=norm(ssF.q);
  return out.filter(function(r){
    if(ssF.show==='pending'&&r.st.left<=0) return false;
    if(ssF.show==='completed'&&r.st.left>0) return false;
    if(qq&&norm(r.q.no+' '+r.q.clientName+' '+(r.q.clientPhone||'')+' '+r.l.name).indexOf(qq)<0) return false;
    return true;
  }).sort(function(a,b){return (b.q.date||'').localeCompare(a.q.date||'')||(b.q.seq||0)-(a.q.seq||0)||a.i-b.i});
}

/* book the next session for a quotation: picks the first item that still has sessions to book; the form lets you switch items */
function qtBook(q){
  if(!q) return;
  var idx=-1;(q.lines||[]).some(function(l,i){if(qtLineStats(q,i).open>0){idx=i;return true}});
  if(idx<0){toast('All sessions on '+q.no+' are already completed or booked.');return}
  var l=q.lines[idx];
  var k=qtLineStats(q,idx).key;editAppt(null,{type:'Procedure',clientId:q.clientId,clientName:q.clientName,procedureId:l.procId,procedureName:l.name,quoteId:q.id,quoteLineId:k,staffIds:qtStaff(q,k)});
}
function qtFiltered(){

    if(q&&norm(x.no+' '+x.clientName+' '+(x.clientPhone||'')+' '+(x.conNo||'')+' '+(x.lines||[]).map(function(l){return l.name}).join(' ')).indexOf(q)<0) return false;

function lastPurchase(itemId){
  var best=null;
  activeVouchers('phMoves').forEach(function(m){if(m.type!=='Purchase')return;(m.lines||[]).forEach(function(l){if(l.itemId===itemId&&(!best||(m.date||'')>(best.m.date||'')||((m.date||'')===(best.m.date||'')&&(m.createdAt||'')>(best.m.createdAt||''))))best={m:m,l:l}})});

}
function lsRows(){
  var q=norm(lsF.q);
  return phInvRows(true).filter(function(r){return r.item.status!=='Inactive'&&(r.qty<=0||r.low)}).map(function(r){
    var lp=lastPurchase(r.item.id);
    r.shortfall=r.reorder==null?0:Math.max(0,r.reorder-r.qty);
    r.suggest=Math.max(1,r.shortfall||(r.reorder||0)||1);
    r.lastSupId=lp?lp.m.supplierId:''; r.lastSup=lp?lp.m.supplierName:''; r.lastDate=lp?lp.m.date:''; r.lastRate=lp?+lp.l.rate||0:(+r.item.openingRate||0);

  }).filter(function(r){
    if(lsF.cat&&r.item.categoryId!==lsF.cat) return false;
    if(q&&norm(r.item.name+' '+(r.item.hsn||'')).indexOf(q)<0) return false;
    if(lsF.show==='low') return r.qty>0;
    if(lsF.show==='out') return r.qty<=0;
    return true;
  }).sort(function(a,b){return (a.qty>0?1:0)-(b.qty>0?1:0)||(b.shortfall-a.shortfall)||byText(a.item.name,b.item.name)});

/* =========================================================
   SPA: Package plans, packages and redemptions
   A package is sold on a tax invoice (price + GST). Using it creates a
   redemption slip (RED-) with no GST; only services beyond the balance go
   on a normal tax invoice.
   ========================================================= */
function memExtraPct(p){var pr=+p.price||+p.paid||0,v=+p.value||0;return pr>0&&v>pr?Math.round((v/pr-1)*100):0}
function addMonthsStr(d0,n){var d=parseD(d0),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ds(d)}
function memExpiry(start,plan){if(!start||!plan)return '';var n=Math.max(1,Math.round(+plan.validity||0));return plan.validityUnit==='Days'?addDays(start,n-1):addDays(addMonthsStr(start,n),-1)}
function memValidityText(p){var n=Math.round(+p.validity||0);if(!n)return '';var u=p.validityUnit==='Days'?'day':'month';return n+' '+u+(n===1?'':'s')}
function memInfo(m,exceptRedId){
  if(m.cancelled)return {uses:[],used:0,bal:0,status:"Cancelled"};
  var uses=activeVouchers('redemptions').filter(function(r){return r.memId===m.id&&r.id!==exceptRedId}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||(+a.seq||0)-(+b.seq||0)});
  var used=r2(uses.reduce(function(s2,r){return s2+(+r.worth||0)},0)), bal=r2(Math.max(0,(+m.value||0)-used)), t=todayStr();
  return {used:used,bal:bal,uses:uses,status:bal<=0.004?'Used up':(m.expiry&&m.expiry<t?'Expired':'Active')};
}
var MEM_PILL={Active:'paid','Used up':'off',Expired:'unpaid'};
function clientMems(cid,date){
  return activeVouchers('members').filter(function(m){return m.clientId===cid&&(!m.start||m.start<=date)&&(!m.expiry||m.expiry>=date)&&memInfo(m).bal>0.004})
    .sort(function(a,b){return (a.expiry||'').localeCompare(b.expiry||'')});
}
function memLabel(m){return (m.planName||'Package')+' · '+m.no}
/* Packages section on the client details screen */
function clientMemSection(cid){
  var list=activeVouchers('members').filter(function(m){return m.clientId===cid}).map(function(m){return {m:m,x:memInfo(m)}})
    .sort(function(a,b){var o={Active:0,'Used up':1,Expired:2};return (o[a.x.status]-o[b.x.status])||(b.m.date||'').localeCompare(a.m.date||'')});
  if(!list.length) return '';
  return '<h3 class="sec-h">Packages</h3><div class="tbl"><table><thead><tr><th>Package</th><th>Plan</th><th class="num">Worth</th><th class="num">Balance</th><th>Valid till</th><th>Status</th></tr></thead><tbody>'+
    list.map(function(r){var m=r.m,x=r.x,exp=x.status==='Expired';return '<tr><td class="nowrap"><button class="link" data-mem="'+esc(m.id)+'">'+esc(m.no)+'</button></td><td>'+esc(m.planName)+'</td><td class="num">'+money(m.value)+'</td>'+
      '<td class="num"><strong>'+money(exp?0:x.bal)+'</strong>'+(exp&&x.bal>0.004?'<div class="sub">'+money(x.bal)+' lapsed</div>':'')+'</td><td class="nowrap">'+fmtDate(m.expiry)+'</td><td><span class="pill '+(MEM_PILL[x.status]||'off')+'">'+esc(x.status)+'</span></td></tr>'}).join('')+
    '</tbody></table></div>';
}
/* packages sold before service lists existed cover every service */
function memCovers(m,serviceId){return !Array.isArray(m.serviceIds)||m.serviceIds.indexOf(serviceId)>=0}
function memCoverNames(ids){if(!Array.isArray(ids))return 'All Spa services';return ids.map(function(id){var sv=findIn('services',id);return sv?sv.name:''}).filter(Boolean).join(', ')}
/* tick-list of services with search, Select all and Clear; nothing ticked by default */
function svcPicker(host,get,set){
  var q='';
  function list(){return S.services.filter(function(sv){return sv.active!==false||get().indexOf(sv.id)>=0}).sort(function(a,b){return byText(a.name,b.name)})}
  function render(){

function memSplit(items){

  var m=memPick(); if(!m) return null;
  var bal=memInfo(m).bal, rem=bal, slip=[], inv=[];
  items.forEach(function(it){

    var lc=lineCalc(it), after=lc.amount, cover=memCovers(m,it.serviceId)?r2(Math.max(0,Math.min(after,rem))):0;
    if(cover<=0.004){inv.push(it);return}

    slip.push(Object.assign({},it,{worth:cover,partial:cover<after-0.004,_src:it}));
    if(cover<after-0.004) inv.push(Object.assign({},it,{name:it.name+' (beyond package balance)',qty:1,rate:r2(after-cover),discPct:0,consumables:[]}));
  });

}

/* =========================================================
   SPA: Membership plans and memberships sold
   A membership is a fee (+GST) for a validity period. While valid, the
   client is billed at the plan's member price for each service that has one.
   The fee is never adjusted against later bills.
   ========================================================= */
function clubPlanPrice(plan,sid){var v=plan&&plan.prices?plan.prices[sid]:null;return v===''||v==null||isNaN(+v)?null:+v}
function clubStatus(m,t){if(m.cancelled)return "Cancelled";t=t||todayStr();return m.expiry&&m.expiry<t?'Expired':(m.start&&m.start>t?'Upcoming':'Active')}
function clientClubs(cid,date){return activeVouchers('clubs').filter(function(m){return m.clientId===cid&&(!m.start||m.start<=date)&&(!m.expiry||m.expiry>=date)}).sort(function(a,b){return (b.expiry||'').localeCompare(a.expiry||'')})}
/* lowest member price for a service across the client's valid memberships */
function clubFor(cid,date,sid){
  var best=null;
  if(!cid||!sid) return null;
  clientClubs(cid,date||todayStr()).forEach(function(m){var p=clubPlanPrice(findIn('clubPlans',m.planId),sid);if(p!=null&&(!best||p<best.price))best={m:m,price:p}});
  return best;
}
function clubSavingOf(it){var s=+it.stdRate||0;return s>(+it.rate||0)?r2((+it.qty||0)*(s-(+it.rate||0))):0}
function clubInfo(items){
  var saving=0, ids={};
  items.forEach(function(it){if(!it.serviceId)return;var s=clubSavingOf(it);if(s>0){saving+=s;if(it.clubId)ids[it.clubId]=1}});
  var m=findIn('clubs',Object.keys(ids)[0]);
  return {saving:r2(saving),id:m?m.id:'',no:m?m.no:'',plan:m?m.planName:''};
}
/* set an invoice line's rate: member price when the client has one, else the standard price */
function clubPriceItem(it){
  var s=findIn('services',it.serviceId); if(!s) return;
  var std=+s.price||0, c=draft&&draft.clientId?clubFor(draft.clientId,draft.date,s.id):null;
  if(c&&c.price<std){it.rate=c.price;it.stdRate=std;it.clubId=c.m.id}else{it.rate=std;it.stdRate=0;it.clubId=''}
  it._auto=it.rate;
}
/* client or date changed: re-price lines whose rate was not typed by hand */
function clubReprice(){
  if(!draft) return;
  var ch=false;
  draft.items.forEach(function(it){if(it.serviceId&&it._auto!=null&&+it.rate===+it._auto){var r0=it.rate,s0=it.stdRate;clubPriceItem(it);if(r0!==it.rate||s0!==it.stdRate)ch=true}});
  if(ch) renderItems();
}

  if((m=s2.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))) return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);

function parseCsv(text){
  text=String(text).replace(/^\uFEFF/,'');

  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}

function impAnalyse(kind,aoa,opt){
  var c=IMP[kind], hdr=(aoa[0]||[]).map(function(h){return norm(String(h).replace(/\*/g,''))}), idx={}, missingCols=[];
  c.cols.forEach(function(col){var i=hdr.indexOf(norm(col.h));if(i<0)i=hdr.indexOf(norm(col.k));idx[col.k]=i;if(i<0&&col.req)missingCols.push(col.h)});

      else if(t==='gst'){var g=+String(v).replace('%','');if(GST_RATES.indexOf(g)<0)errs.push('GST must be '+GST_RATES.join(', '));else o[col.k]=g}

/* save many records: one request per 300 on the server, otherwise one by one */
function bulkPut(kind,objs){
  if(!objs.length) return Promise.resolve();
  if(!canEdit()&&objs.some(function(o){return !!findIn(kind,o.id)}))return Promise.reject(new Error('Only Admin can edit existing records, including imports.'));
  if(!window.claude&&storeMode==='live'&&kind!=='users'){
    var chunks=[];for(var i=0;i<objs.length;i+=300)chunks.push(objs.slice(i,i+300));
    return chunks.reduce(function(p,ch){return p.then(function(){
      return fetch('api/index.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'bulk',collection:COL[kind],records:ch.map(function(o){var d=Object.assign({},o);delete d.id;return {id:o.id,data:d}})})})
        .then(function(r){return r.json().catch(function(){return {}}).then(function(x){if(!r.ok)throw new Error(x.error||'Import failed.');
          ch.forEach(function(o){var l=S[kind],k=l.findIndex(function(z){return z.id===o.id});if(k>=0)l[k]=o;else l.push(o)});scheduleRefresh()})});
    })},Promise.resolve());
  }
  return objs.reduce(function(p,o){return p.then(function(){return put(kind,o)})},Promise.resolve());
}

function phSupAlloc(sid){
  var s=findIn('phSuppliers',sid)||{}, bills=[];
  if((+s.openingBal||0)>0) bills.push({id:'ob:'+sid,no:'Opening balance',date:'',total:r2(s.openingBal),paid:0,opening:true});
  activeVouchers('phMoves').filter(function(m){return m.type==='Purchase'&&m.supplierId===sid}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||(+a.seq||0)-(+b.seq||0)})
    .forEach(function(m){bills.push({id:m.id,no:m.no,date:m.date,total:r2(m.total),paid:0,billNo:m.supplierBillNo||''})});
  var map={}; bills.forEach(function(b){map[b.id]=b});
  var pays=activeVouchers('phPays').filter(function(p){return p.supplierId===sid}), pool=0, paidTot=0;
  pays.forEach(function(p){var amt=+p.amount||0;paidTot+=amt;var b=p.purchaseId&&map[p.purchaseId];if(b){var use=Math.min(amt,Math.max(0,r2(b.total-b.paid)));b.paid=r2(b.paid+use);amt=r2(amt-use)}pool=r2(pool+amt)});
  bills.forEach(function(b){var room=r2(b.total-b.paid);if(room>0&&pool>0){var use=Math.min(room,pool);b.paid=r2(b.paid+use);pool=r2(pool-use)}b.bal=r2(b.total-b.paid)});
  var neg=(+s.openingBal||0)<0?r2(+s.openingBal):0;
  return {bills:bills,paid:r2(paidTot),advance:r2(pool),net:r2(bills.reduce(function(t,b){return t+b.total},0)+neg-paidTot)};
}

/* queue: wait a moment so the invoice PDF includes a payment saved right after it */
var waQ=[],waT=null,waBusy=false;
function waQueue(kind,id,manual){
  if(!manual&&!waOn(WA_GROUP[kind])) return;
  if(waQ.some(function(j){return j.kind===kind&&j.id===id})) return;
  waQ.push({kind:kind,id:id,manual:!!manual}); clearTimeout(waT); waT=setTimeout(waRun,manual?50:1500);
}
function waRun(){
  if(waBusy||!waQ.length) return; waBusy=true;
  var j=waQ.shift(), b=null; try{b=waBuild(j.kind,j.id)}catch(e){b=null}
  var next=function(){waBusy=false;if(waQ.length)waT=setTimeout(waRun,200)};
  if(!b){if(j.manual)toast('Nothing to send for this document.');return next()}
  if((j.kind!=='edu')&&(!b.pdf||!b.pdf.data)){if(j.manual)toast('The PDF could not be created.');return next()}
  var body={action:'wa_send',group:b.group,kind:b.kind,docId:b.docId,docNo:b.docNo,clientId:b.clientId,clientName:b.clientName,to:b.to,params:b.params,dedupe:b.dedupe||'',manual:j.manual};
  if(b.pdf){body.pdf=waB64(b.pdf.data);body.filename=b.pdf.name}else{body.fileId=b.fileId;body.filename=b.filename}
  fetch('api/index.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {}}).then(function(x){if(!r.ok)throw new Error(x.error||'Request failed.');return x})})
    .then(function(x){
      if(x.log){var i=S.waLog.findIndex(function(l){return l.id===x.log.id});if(i<0)S.waLog.push(x.log);scheduleRefresh()}
      var what=WA_LABEL[b.group]||'Message';
      if(x.skipped){if(j.manual)toast('Not sent: '+x.skipped)}
      else if(x.ok) toast('WhatsApp: '+what+' sent to '+(b.clientName||'client'));
      else toast('WhatsApp '+what.toLowerCase()+' not sent: '+(x.error||'error'));
    }).catch(function(e){toast('WhatsApp not sent: '+waErrText(e))}).then(next);
}
/* hook: a new document was saved */
function waOnSaved(kind,obj){
  try{
    if(kind==='invoices'&&!obj.cancelled) waQueue('inv',obj.id);
    else if(kind==='aeInvoices'&&!obj.cancelled) waQueue('aeinv',obj.id);
    else if(kind==='phMoves'&&obj.type==='Sale'&&obj.clientId&&!obj.cancelled) waQueue('phsale',obj.id);
    else if(kind==='receipts'&&obj.clientId) waQueue('receipt',obj.id);
    else if(kind==='aeQuotes') waQueue('quote',obj.id);
    else if(kind==='aeCons'&&waMeds(obj.meds)) waQueue('conrx',obj.id);
    else if(kind==='aeSessions'){
      if(waMeds(obj.meds)) waQueue('sesrx',obj.id);
      var sp=waSesProc(obj);
      if(sp.id&&sp.proc&&sp.proc.eduPdf&&sp.proc.eduPdf.id&&activeVouchers('aeSessions').filter(function(x){return x.clientId===obj.clientId&&waSesProc(x).id===sp.id}).length===1) waQueue('edu',obj.id);
    }
  }catch(e){}
}

/* bill-wise balances for one vendor (credit expenses + opening balance; payments settle the linked bill first, then the oldest) */
function vendorAlloc(vid){
  var v=findIn('vendors',vid)||{}, bills=[];
  if((+v.openingBal||0)>0) bills.push({id:'ob:'+vid,no:'Opening balance',date:'',total:r2(v.openingBal),paid:0,opening:true});
  activeVouchers('expenses').filter(function(e){return e.vendorId===vid&&!e.paidNow}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||(+a.seq||0)-(+b.seq||0)})
    .forEach(function(e){bills.push({id:e.id,no:e.no,date:e.date,total:r2(e.total),paid:0,billNo:e.billNo||'',dept:e.dept,cat:e.catName})});
  var map={}; bills.forEach(function(b){map[b.id]=b});
  var pool=0, paidTot=0;
  activeVouchers('vpays').filter(function(p){return p.vendorId===vid}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')}).forEach(function(p){var amt=+p.amount||0;paidTot+=amt;var b=p.expenseId&&map[p.expenseId];if(b){var use=Math.min(amt,Math.max(0,r2(b.total-b.paid)));b.paid=r2(b.paid+use);amt=r2(amt-use)}pool=r2(pool+amt)});
  bills.forEach(function(b){var room=r2(b.total-b.paid);if(room>0&&pool>0){var use=Math.min(room,pool);b.paid=r2(b.paid+use);pool=r2(pool-use)}b.bal=r2(b.total-b.paid)});
  return {bills:bills,paid:r2(paidTot),advance:r2(pool),net:r2(bills.reduce(function(t,b){return t+b.total},0)-paidTot)};
}
function expStatus(e){
  if(e.paidNow) return {status:'paid',paid:+e.total||0,bal:0};
  if(!e.vendorId) return {status:'unpaid',paid:0,bal:+e.total||0};
  var b=vendorAlloc(e.vendorId).bills.find(function(x){return x.id===e.id})||{paid:0,bal:+e.total||0};
  return {status:b.bal<=0.004?'paid':(b.paid>0.004?'partial':'unpaid'),paid:b.paid,bal:b.bal};
}

    var v=findIn('vendors',vid)||{}, a=vendorAlloc(vid), rows=[];
    if(+v.openingBal) rows.push({date:'',ref:'',part:'Opening balance',dr:0,cr:+v.openingBal,ord:0});
    activeVouchers('expenses').forEach(function(e){if(e.vendorId!==vid)return;rows.push({date:e.date,ref:e.no,part:e.catName+(e.billNo?' · bill '+e.billNo:'')+(e.paidNow?' (paid now)':''),dr:0,cr:+e.total||0,ord:1,seq:e.seq});if(e.paidNow)rows.push({date:e.date,ref:e.no,part:'Paid with bill ('+(e.mode||'')+(e.reference?' · '+e.reference:'')+')',dr:+e.total||0,cr:0,ord:2,seq:e.seq})});
    activeVouchers('vpays').forEach(function(p){if(p.vendorId===vid)rows.push({date:p.date,ref:p.no,part:'Payment ('+p.mode+(p.reference?' · '+p.reference:'')+')'+(p.expenseNo?' against '+p.expenseNo:''),dr:+p.amount||0,cr:0,ord:3,seq:p.seq})});
    rows.sort(function(x,y){return (x.date||'').localeCompare(y.date||'')||x.ord-y.ord||(x.seq||0)-(y.seq||0)});
    var bal=0; rows.forEach(function(r){bal=r2(bal+r.cr-r.dr);r.bal=bal});
    m.innerHTML='<h2>'+esc(v.name||'Vendor')+' · ledger</h2><div class="mem-sum" style="margin-top:-4px"><span>Bills <strong>'+money(rows.reduce(function(t,r){return t+r.cr},0))+'</strong></span><span>Paid <strong>'+money(rows.reduce(function(t,r){return t+r.dr},0))+'</strong></span><span>Balance payable <strong>'+money(Math.max(0,a.net))+'</strong></span>'+(a.advance>0.004?'<span>Advance with vendor <strong>'+money(a.advance)+'</strong></span>':'')+'</div>'+
      (rows.length?'<div class="tbl"><table><thead><tr><th>Date</th><th>Particulars</th><th>Ref</th><th class="num">Bill</th><th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody>'+
      rows.map(function(r){return '<tr><td class="nowrap">'+(r.date?fmtDate(r.date):'—')+'</td><td>'+esc(r.part)+'</td><td class="nowrap">'+esc(r.ref||'—')+'</td><td class="num">'+(r.cr?money(r.cr):'')+'</td><td class="num">'+(r.dr?money(r.dr):'')+'</td><td class="num">'+money(r.bal)+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="hint">No entries yet.</p>')+
      '<div class="m-actions"><button class="btn" data-x>Close</button><button class="btn" data-csv>Export CSV</button>'+(readOnly?'':'<button class="btn primary w" data-pay>Record payment</button>')+'</div>';
    m.querySelector('[data-x]').onclick=closeModal;
    m.querySelector('[data-csv]').onclick=function(){saveFile('vendor-ledger-'+(v.name||'').replace(/\W+/g,'-')+'.csv',csv([['Date','Particulars','Ref','Bill','Paid','Balance']].concat(rows.map(function(r){return [r.date,r.part,r.ref,r.cr||'',r.dr||'',r.bal]}))))};
    var pb=m.querySelector('[data-pay]'); if(pb) pb.onclick=function(){vendorPayDialog(vid,'',function(){vendorLedger(vid)})};
  };
  var m=openModal('','--m13',true); render(m); modalRefresh=function(){render(m)};
}

function erData(){
  var dp=myDeptName()||erF.dept, list=activeVouchers('expenses').filter(function(e){return (!e.adminOnly||isAdmin())&&(!dp||dp==='__all'||e.dept===dp)&&(!erF.from||e.date>=erF.from)&&(!erF.to||e.date<=erF.to)});
  var cats={},depts={},months={},r={n:list.length,amount:0,tax:0,total:0,paid:0,due:0};
  list.forEach(function(e){var x=expStatus(e);r.amount+=+e.amount||0;r.tax+=+e.tax||0;r.total+=+e.total||0;r.paid+=x.paid;r.due+=x.bal;
    var c=cats[e.catId]=cats[e.catId]||{name:e.catName,n:0,amount:0,tax:0,total:0};c.n++;c.amount=r2(c.amount+(+e.amount||0));c.tax=r2(c.tax+(+e.tax||0));c.total=r2(c.total+(+e.total||0));
    depts[e.dept]=r2((depts[e.dept]||0)+(+e.total||0));var mk=(e.date||'').slice(0,7);months[mk]=r2((months[mk]||0)+(+e.total||0))});
  ['amount','tax','total','paid','due'].forEach(function(k){r[k]=r2(r[k])});
  r.cats=Object.keys(cats).map(function(k){return cats[k]}).sort(function(a,b){return b.total-a.total});
  r.depts=Object.keys(depts).map(function(k){return {name:k,total:depts[k]}}).sort(function(a,b){return b.total-a.total});
  r.months=Object.keys(months).sort().map(function(k){return {name:parseD(k+'-01').toLocaleDateString('en-IN',{month:'short',year:'numeric'}),total:months[k]}});
  return r;
}

  $$('.mi[data-key]').forEach(function(b){b.closest('li').hidden=!!(keys&&keys.indexOf(b.dataset.key)<0)||(!CURRENT_USER||(!CURRENT_USER.role==='Admin'&&b.dataset.key==='business'));});
  if(CURRENT_USER&&CURRENT_USER.role!=='Admin')$$('.mi[data-key="business"],.mi[data-key="wa-settings"]').forEach(function(b){b.closest('li').hidden=true});
  if(CURRENT_USER&&!['Admin','Manager'].includes(CURRENT_USER.role))$$('.mi[data-key="users"]').forEach(function(b){b.closest('li').hidden=true});
  $$('.mgroup').forEach(function(g){var sub=$('#'+g.getAttribute('aria-controls'));g.closest('li').hidden=!$$('li',sub).some(function(li){return !li.hidden});});
}
function authOverlay(message){
  document.documentElement.classList.remove('resuming');
  var old=$('#auth-overlay');if(old)old.remove();
  document.body.insertAdjacentHTML('afterbegin','<style>#auth-overlay{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 12% 18%,#ffffff99 0 18vmin,transparent calc(18vmin + 1px)),radial-gradient(circle at 88% 85%,#ffffff66 0 28vmin,transparent calc(28vmin + 1px)),radial-gradient(circle at 80% 12%,#9fbfae55 0 14vmin,transparent calc(14vmin + 1px)),linear-gradient(135deg,#e7efe9 0%,#cfe0d6 55%,#b7cfc2 100%);display:grid;place-items:center;padding:20px;overflow:auto}#auth-overlay .auth-card{box-shadow:0 24px 70px #2a3a3633}.auth-card{width:min(420px,100%);background:#fff;border-radius:16px;padding:28px;box-shadow:0 24px 80px #0008;color:#17262a}.auth-brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-bottom:12px}.auth-brand img{max-width:200px;max-height:80px;object-fit:contain}.auth-card h1{margin:0;font-size:26px}.auth-card>p{text-align:center;color:#5b6b6e}.auth-card label{display:block;margin:14px 0 5px;font-weight:700}#auth-overlay .auth-card input{width:100%;box-sizing:border-box;padding:11px 12px;font:inherit;font-size:15px;color:#17262a;background:#f2f4f3;border:1px solid transparent;border-radius:9px;outline:none;color-scheme:light;transition:background .15s,border-color .15s,box-shadow .15s}#auth-overlay .auth-card input:focus{background:#fff;border-color:#1f2a2c;box-shadow:0 0 0 3px #1f2a2c1f}#auth-overlay .auth-card input:-webkit-autofill,#auth-overlay .auth-card input:-webkit-autofill:hover,#auth-overlay .auth-card input:-webkit-autofill:focus{-webkit-text-fill-color:#17262a;-webkit-box-shadow:0 0 0 40px #f2f4f3 inset;caret-color:#17262a}.auth-card button{margin-top:18px;width:100%;padding:12px;background:#1f2a2c;color:white;border:0;border-radius:9px;font-weight:700;cursor:pointer;transition:background .15s}.auth-card button:hover{background:#2c3a3d}.auth-card{color-scheme:light}.auth-error{color:#b42318;min-height:20px;margin-top:10px}</style><div id="auth-overlay"><form class="auth-card" id="login-form"><div class="auth-brand"><img id="auth-logo" alt="" hidden><h1 id="auth-name"></h1></div><label>User ID</label><input id="login-user" autocomplete="username" required><label>Password</label><div class="pw-wrap"><input id="login-pass" type="password" autocomplete="current-password" required></div><p class="auth-error">'+esc(message||'')+'</p><button>Sign in</button></form></div>');
  var paintAuth=function(n,src){var h=$('#auth-name'),im=$('#auth-logo');if(!h)return;h.textContent=n||'Veda Associates';if(src){im.src=src;im.alt=(n||'')+' logo';im.hidden=false}else im.hidden=true};
  try{var bc=JSON.parse(localStorage.getItem('brand')||'null');paintAuth(bc&&bc.name,bc&&bc.src)}catch(e){paintAuth('','')}
  fetch('api/index.php?action=brand').then(function(r){return r.ok?r.json():null}).then(function(x){if(x&&(x.name||x.logo)){var bc2=null;try{bc2=JSON.parse(localStorage.getItem('brand')||'null')}catch(e){}paintAuth(x.name,(bc2&&bc2.src)||x.logo)}}).catch(function(){});
  pwEye($('#login-pass'));
  $('#login-form').onsubmit=function(e){e.preventDefault();var err=$('.auth-error',this);authCall('login',{userId:$('#login-user').value.trim(),password:$('#login-pass').value}).then(function(x){CURRENT_USER=x.user;$('#auth-overlay').remove();startApp();if(CURRENT_USER.mustChangePassword)passwordDialog();}).catch(function(e2){err.textContent=e2.message});};
}
var EYE_ON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>', EYE_OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.6M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>';
/* eye button inside a password box: tap to show, tap again to hide */
function pwEye(inp){
  if(!inp||inp._eye) return; inp._eye=1;
  var w=inp.parentNode; if(!w.classList.contains('pw-wrap')){w=document.createElement('div');w.className='pw-wrap';inp.parentNode.insertBefore(w,inp);w.appendChild(inp)}
  var b=document.createElement('button'); b.type='button'; b.className='pw-eye'; b.innerHTML=EYE_ON; b.setAttribute('aria-label','Show password'); b.title='Show password';
  b.onclick=function(){var show=inp.type==='password';inp.type=show?'text':'password';b.innerHTML=show?EYE_OFF:EYE_ON;b.setAttribute('aria-label',show?'Hide password':'Show password');b.title=show?'Hide password':'Show password';inp.focus()};
  w.appendChild(b);
}
function passwordDialog(){openModal('<h2>Change password</h2><form id="pw-form"><div class="field"><label>Current password</label><input id="pw-old" type="password" required></div><div class="field"><label>New password</label><input id="pw-new" type="password" minlength="8" required></div><p class="err" id="pw-err" hidden></p><div class="m-actions"><button class="btn primary">Save password</button></div></form>','--m10',false,function(m){pwEye(m.querySelector('#pw-old'));pwEye(m.querySelector('#pw-new'));m.querySelector('#pw-form').onsubmit=function(e){e.preventDefault();authCall('change_password',{oldPassword:m.querySelector('#pw-old').value,newPassword:m.querySelector('#pw-new').value}).then(function(){CURRENT_USER.mustChangePassword=false;closeModal();toast('Password updated');}).catch(function(x){var er=m.querySelector('#pw-err');er.textContent=x.message;er.hidden=false})}})}
/* keep the open screen (and any half-filled form) across a page refresh, per browser tab */
var RESUME_KEY='resume-v1';
function saveResume(){
  if(!CURRENT_USER) return;
  var st={user:CURRENT_USER.id||CURRENT_USER.userId||CURRENT_USER.name,view:curView,key:current,
    modes:{ai:aiMode,ses:sesMode,con:conMode,qt:qtMode,ph:phMode},
    drafts:{spa:draft,ai:aiDraft,ses:sesDraft,con:conDraft,qt:qtDraft,ph:phDraft}};
  try{sessionStorage.setItem(RESUME_KEY,JSON.stringify(st))}catch(e){try{st.drafts={};st.modes={ai:'list',ses:'list',con:'list',qt:'list',ph:{in:'list',out:'list'}};sessionStorage.setItem(RESUME_KEY,JSON.stringify(st))}catch(e2){}}
}
window.addEventListener('pagehide',saveResume);
window.addEventListener('beforeunload',saveResume);
function resumeApp(){
  var st=null; try{st=JSON.parse(sessionStorage.getItem(RESUME_KEY)||'null');sessionStorage.removeItem(RESUME_KEY)}catch(e){}
  if(!st||st.user!==(CURRENT_USER.id||CURRENT_USER.userId||CURRENT_USER.name)) return false;
  if(st.view==='home'){if(CURRENT_USER.role==='Admin'||CURRENT_USER.role==='Manager'){show('home');return true}return false}
  if(['spa','aes','pha'].indexOf(st.view)<0||!allowedDept(st.view)) return false;
  var btn=$('#nav-'+st.view+' .mi[data-key="'+st.key+'"]'), ok=st.key&&SECTIONS[st.key]&&btn&&!btn.closest('li').hidden;
  if(ok){
    var m=st.modes||{}, d=st.drafts||{};
    try{
      draft=d.spa||null; aiDraft=d.ai||null; sesDraft=d.ses||null; conDraft=d.con||null; qtDraft=d.qt||null; if(d.ph)phDraft=d.ph;
      aiMode=(m.ai==='form'&&aiDraft)?'form':'list'; sesMode=(m.ses==='form'&&sesDraft)?'form':'list'; conMode=(m.con==='form'&&conDraft)?'form':'list'; qtMode=(m.qt==='form'&&qtDraft)?'form':'list';
      if(m.ph){phMode.in=(m.ph.in==='form'&&phDraft.in)?'form':'list';phMode.out=(m.ph.out==='form'&&phDraft.out)?'form':'list'}
    }catch(e){}
  }
  show(st.view);
  if(ok&&st.key!==current){try{go(st.key)}catch(e){go({spa:'dashboard',aes:'ae-dashboard',pha:'ph-dashboard'}[st.view])}}
  return true;
}
function initials(n){var w=String(n||'').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()}
function startApp(){waLoadStatus().then(function(){scheduleRefresh()});applyRoleUI();$$('.side').forEach(function(nav){nav.insertAdjacentHTML('beforeend','<div class="sidebar-user"><div class="su-card"><div class="su-row"><span class="su-av" aria-hidden="true">'+esc(initials(CURRENT_USER.name))+'</span><div class="su-who"><strong>'+esc(CURRENT_USER.name)+'</strong><span class="su-role">'+esc(CURRENT_USER.role)+'</span></div></div><button type="button" class="su-out" data-logout><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>Log out</button></div></div>')});$$('[data-logout]').forEach(function(b){b.onclick=function(){authCall('logout').finally(function(){location.reload()})}});initStore();if(resumeApp())return;if(CURRENT_USER.role==='Spa')show('spa');else if(CURRENT_USER.role==='Aesthetics')show('aes');else if(CURRENT_USER.role==='Pharmacy')show('pha');else show('home');}
function initAuth(){authCall('me').then(function(x){CURRENT_USER=x.user;startApp();if(CURRENT_USER.mustChangePassword)passwordDialog();}).catch(function(){authOverlay();});}
initAuth();
})();
