<!doctype html><meta charset="utf-8"><title>Clinic Flow — Initial Admin Setup</title><style>body{font:16px system-ui;background:#102022;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;color:#17262a;padding:28px;border-radius:14px;width:min(420px,90vw)}label{display:block;margin-top:12px;font-weight:700}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px}button{margin-top:20px;padding:10px 14px;background:#4f58c9;color:#fff;border:0;border-radius:8px}.err{color:#b42318}</style><form class="card" id="f"><h1>Initial Admin Setup</h1><p>Use once to create the first Clinic Flow Admin account.</p><label>Setup key<input id="key" type="password" required></label><label>Full name<input id="name" required></label><label>User ID<input id="uid" required></label><label>Email<input id="email" type="email"></label><label>Password<input id="pass" type="password" minlength="8" required></label><p class="err" id="err"></p><button>Create Admin</button></form><script>f.onsubmit=async e=>{e.preventDefault();err.textContent='';let r=await fetch('setup.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setupKey:key.value,name:name.value,userId:uid.value,email:email.value,password:pass.value})});let x=await r.json().catch(()=>({error:'Setup failed.'}));if(!r.ok){err.textContent=x.error;return}f.innerHTML='<h1>Admin created</h1><p>Return to the clinic app and sign in.</p>'}</script>
